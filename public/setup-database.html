<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVSTAR Database Setup</title><style>body{font:16px system-ui;background:#f4f7fb;color:#172033;margin:0;padding:32px}.panel{max-width:650px;margin:5vh auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #17203312}h1{margin-top:0}input,button{font:inherit;padding:12px;border-radius:9px;width:100%;box-sizing:border-box}input{border:1px solid #cbd5e1;margin:8px 0 16px}button{border:0;background:#174ea6;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:14px;border-radius:10px;min-height:48px}small{color:#526078}</style></head>
<body><main class="panel"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><img src="/api/branding/logo" alt="NAVSTAR Analytics logo" style="width:110px;height:65px;object-fit:contain;background:#fff;border-radius:8px" onerror="this.style.display='none'"><h1>NAVSTAR ERP · Database setup</h1></div><p>This protected installer creates the database tables and starter roles in your connected Cloudflare D1 database.</p><label for="key">Setup key</label><input id="key" type="password" autocomplete="off" placeholder="Paste your NAVSTAR_SETUP_KEY"><button id="run">Install database schema</button><p><small>Run once after configuring the secret in Cloudflare Worker. Do not share the setup key.</small></p><pre id="result">Waiting for setup.</pre></main><script>
document.getElementById('run').addEventListener('click',async()=>{const key=document.getElementById('key').value.trim();const button=document.getElementById('run');const out=document.getElementById('result');if(!key){out.textContent='Enter the setup key first.';return;}button.disabled=true;out.textContent='Installing… please wait.';try{const response=await fetch('/api/setup-database',{method:'POST',headers:{'Authorization':'Bearer '+key}});const data=await response.json();out.textContent=JSON.stringify(data,null,2);}catch(e){out.textContent='Request failed: '+e.message;}finally{button.disabled=false;}});
</script></body></html>
