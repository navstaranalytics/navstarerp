<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navstar | Parent & Learner Portal</title>
<link rel="icon" href="/api/branding/logo">
<style>
:root{--navy:#10213c;--blue:#3978f6;--ink:#17243a;--muted:#718096;--line:#e6ebf2;--bg:#f3f6fb;--green:#16845b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,Segoe UI,sans-serif}
header{background:var(--navy);color:#fff;padding:18px 5vw;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;background:#fff;border-radius:9px;padding:3px;object-fit:contain}.brand b{font-size:17px;letter-spacing:.5px}.brand small{display:block;color:#aebed4;font-size:11px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--blue);color:#fff;font-weight:650}.btn-light{background:#fff;color:var(--navy)}main{max-width:1180px;margin:28px auto;padding:0 20px}
h1{font-size:26px;margin:0 0 4px}.muted{color:var(--muted)}.intro{margin-bottom:22px}
.notice{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:14px 0}.error{color:#a52a2a;border-color:#f0caca;background:#fff8f8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 4px 18px #182a4410}.card h2,.card h3{margin:0 0 10px}.metric{font-size:26px;font-weight:750;letter-spacing:-.5px}.label{font-size:12px;color:var(--muted)}
.child{cursor:pointer;text-align:left;color:var(--ink);background:#fff;border:1px solid var(--line);width:100%;padding:16px}.child.active{border:2px solid var(--blue);padding:15px}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.section h2{font-size:18px;margin:0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}.empty{padding:18px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}
@media(max-width:600px){header{padding:14px 16px}main{margin:20px auto;padding:0 14px}h1{font-size:22px}.section-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<header><div class="brand"><img src="/api/branding/logo" alt="Navstar"><div><b>Navstar</b><small>FAMILY & LEARNER PORTAL</small></div></div><button class="btn-light" id="logout" type="button">Sign out</button></header>
<main>
<div class="intro"><h1 id="welcome">Welcome</h1><div class="muted" id="schoolName">Loading your school information…</div></div>
<div id="notice" class="notice" role="status">Loading linked learner records…</div>
<section id="learnerPicker" class="grid section" aria-label="Linked learners"></section>
<section id="summary" class="grid section"></section>
<section class="section"><div class="section-head"><h2>Published reports</h2><span class="muted" id="reportHint"></span></div><div id="reports" class="card"></div></section>
<section class="section"><div class="section-head"><h2>Class timetable</h2><span class="muted" id="termLabel"></span></div><div id="timetable" class="card"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let learners=[],selectedId="";
async function api(path,options={}){
 const token=sessionStorage.getItem("navstar_session_token");
 if(!token){location.replace("/login");throw new Error("Your secure session has expired. Please sign in again.")}
 const response=await fetch(path,{credentials:"same-origin",...options,headers:{"Content-Type":"application/json","X-Navstar-Session":token,...(options.headers||{})}});
 let data={};try{data=await response.json()}catch{}
 if(!response.ok)throw new Error(data.error||"Could not load your portal information.");
 return data;
}
function showNotice(message,isError=false){$("notice").textContent=message;$("notice").className="notice"+(isError?" error":"")}
function renderPicker(){
 $("learnerPicker").innerHTML=learners.map(l=>'<button type="button" class="card child '+(l.id===selectedId?'active':'')+'" data-learner="'+esc(l.id)+'"><b>'+esc([l.first_name,l.middle_name,l.last_name].filter(Boolean).join(" "))+'</b><div class="label">Admission: '+esc(l.admission_number||"—")+'</div><div class="label">Class: '+esc(l.enrollment?.grade_name||"Not enrolled")+' · '+esc(l.enrollment?.stream_name||"No stream")+'</div></button>').join("");
 $("learnerPicker").querySelectorAll("[data-learner]").forEach(b=>b.addEventListener("click",()=>{selectedId=b.dataset.learner;renderPicker();renderLearner()}));
}
function renderLearner(){
 const l=learners.find(x=>x.id===selectedId);if(!l)return;
 const a=l.attendance||{},total=Number(a.total||0),present=Number(a.present||0),rate=total?Math.round(present/total*100):0;
 $("summary").innerHTML=[
  ["Attendance",rate+"%",present+" present of "+total+" recorded sessions"],
  ["Absent",Number(a.absent||0),"Recorded absent sessions"],
  ["Late",Number(a.late||0),"Recorded late sessions"],
  ["Current class",l.enrollment?.grade_name||"—",l.enrollment?.academic_year||"No active enrolment"]
 ].map(x=>'<div class="card"><div class="label">'+esc(x[0])+'</div><div class="metric">'+esc(x[1])+'</div><div class="label">'+esc(x[2])+'</div></div>').join("");
 const reports=Array.isArray(l.reports)?l.reports:[];
 $("reportHint").textContent=reports.length+" published";
 $("reports").innerHTML=reports.length?'<div class="table-wrap"><table><thead><tr><th>Academic year</th><th>Term</th><th>Published</th><th>Report</th></tr></thead><tbody>'+reports.map(r=>'<tr><td>'+esc(r.academic_year_id||"—")+'</td><td>'+esc(r.term_id||"—")+'</td><td>'+esc(r.published_at||"—")+'</td><td>'+esc(r.status||"Published")+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No published reports are available yet.</div>';
 const entries=Array.isArray(l.timetable)?l.timetable:[];
 const days=["","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
 $("timetable").innerHTML=entries.length?'<div class="table-wrap"><table><thead><tr><th>Day</th><th>Time</th><th>Learning area</th><th>Room</th></tr></thead><tbody>'+entries.map(t=>'<tr><td>'+esc(days[Number(t.weekday)]||"—")+'</td><td>'+esc(t.start_time||"")+" – "+esc(t.end_time||"")+'</td><td>'+esc(t.learning_area||"—")+'</td><td>'+esc(t.room||"—")+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No timetable entries are available for this learner yet.</div>';
 $("termLabel").textContent=l.enrollment?.academic_year||"";
}
async function load(){
 try{
  const me=await api("/api/auth/me");
  if(!["parent","student"].includes(me.user?.roleKey)){location.replace(me.user?.roleKey==="super_admin"?"/super-admin":"/school-portal");return}
  $("welcome").textContent="Welcome, "+(me.user.fullName||"");
  $("schoolName").textContent=me.user.schoolName||"Your school";
  const data=await api("/api/portal/me");
  learners=data.learners||[];
  if(!learners.length){showNotice("No learner is linked to this account yet. Please contact your school administrator to verify the parent or learner account link.");$("learnerPicker").innerHTML="";$("summary").innerHTML="";$("reports").innerHTML='<div class="empty">No linked learner records.</div>';$("timetable").innerHTML='<div class="empty">No timetable available.</div>';return}
  selectedId=learners[0].id;showNotice("Your linked learner information is up to date.");renderPicker();renderLearner();
 }catch(error){showNotice(error.message,true)}
}
$("logout").addEventListener("click",async()=>{try{await api("/api/auth/logout",{method:"POST"})}catch{}sessionStorage.removeItem("navstar_session_token");location.replace("/login")});
load();
</script></body></html>
