<script>async function applyNavstarTerminology(){try{const r=await fetch('/api/terminology',{credentials:'same-origin'});if(!r.ok)return;const d=await r.json(),t=d.terminology||{};const base={learner:'Learner',learning_area:'Learning area',grade:'Grade',stream:'Stream',school_admin:'School Administrator',parent:'Parent / Guardian',timetable:'Timetable',term:'Term',academic_year:'Academic year',bursar:'Bursar / Finance Officer',report_card:'Report card'};const map=new Map();for(const [k,v] of Object.entries(t)){if(typeof v!=='string'||!v.trim())continue;const old=base[k];if(old){map.set(old,v);map.set(old+'s',v.endsWith('s')?v:v+'s');}}if(!map.size)return;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const p=n.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA','INPUT','OPTION'].includes(p.tagName))continue;const raw=n.nodeValue,trim=raw.trim(),next=map.get(trim);if(next)n.nodeValue=raw.replace(trim,next);}for(const el of document.querySelectorAll('[placeholder],[title],[aria-label]'))for(const attr of ['placeholder','title','aria-label']){const val=el.getAttribute(attr);if(val&&map.has(val))el.setAttribute(attr,map.get(val));}}catch(e){console.warn('Navstar terminology could not be applied',e)}}

const KEY='navstar_superadmin_v2',USERKEY='navstar_platform_users_v1',MSGKEY='navstar_messages_v1',SETKEY='navstar_platform_settings_v1',AUDKEY='navstar_audit_v1';
const counties=['Baringo','Bomet','Bungoma','Busia','Elgeyo-Marakwet','Embu','Garissa','Homa Bay','Isiolo','Kajiado','Kakamega','Kericho','Kiambu','Kilifi','Kirinyaga','Kisii','Kisumu','Kitui','Kwale','Laikipia','Lamu','Machakos','Makueni','Mandera','Marsabit','Meru','Migori','Mombasa','Murang’a','Nairobi','Nakuru','Nandi','Narok','Nyamira','Nyandarua','Nyeri','Samburu','Siaya','Taita-Taveta','Tana River','Tharaka-Nithi','Trans Nzoia','Turkana','Uasin Gishu','Vihiga','Wajir','West Pokot'];
const plans=[{name:'Starter',price:2500,learners:300,storage:5,ai:100,modules:'Core school operations'},{name:'Professional',price:6500,learners:1200,storage:25,ai:500,modules:'Core + academics + analytics'},{name:'Enterprise',price:15000,learners:5000,storage:100,ai:2500,modules:'All modules + priority support'},{name:'Trial',price:0,learners:100,storage:2,ai:25,modules:'Evaluation access'}];
const $=id=>document.getElementById(id);let page='overview',schools=load(KEY,[]),users=load(USERKEY,[]),messages=load(MSGKEY,[]),settings=load(SETKEY,{platformName:'Navstar Analytics',supportEmail:'support@navstaranalytics.com',defaultCurrency:'KES',timezone:'Africa/Nairobi',maintenance:false,aiEnabled:true,registrationOpen:true}),audit=load(AUDKEY,[]);let overviewMetrics=null,overviewAudit=[],overviewLoading=true;
function load(k,d){return d}function save(k,v){const status=$('saveState');if(status)status.textContent='Not saved: this workflow is not connected to central D1 storage.';return false}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}function log(action,detail){fetch("/api/audit-events",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,detail})}).catch(()=>{});}

function pagesOverview(){
  const active=schools.filter(s=>s.status==='Active').length,pending=schools.filter(s=>s.status==='Pending').length,metrics=overviewMetrics||{};
  const months=Array.isArray(metrics.schoolRegistrationsByMonth)?metrics.schoolRegistrationsByMonth:[];
  const now=new Date(),labels=[],values=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');labels.push(d.toLocaleDateString('en-KE',{month:'short'}));values.push(Number(months.find(x=>x.month===key)?.total||0))}
  const max=Math.max(1,...values),trend=values.map((v,i)=>'<div class="bar-wrap"><div class="bar" title="'+v+' schools" style="height:'+Math.max(3,v/max*104)+'px"></div><small>'+labels[i]+'</small></div>').join('');
  const recent=schools.slice(0,5).map(s=>'<div class="list-row"><div><b>'+esc(s.name)+'</b><small>'+esc(s.county)+' · '+esc(s.level||s.curriculum||'School')+'</small></div>'+pill(s.status)+'</div>').join('')||'<div class="empty">No school records yet. Register your first institution.</div>';
  const activity=overviewAudit.slice(0,4).map(x=>'<div class="list-row"><div><b>'+esc(x.action||'Platform activity')+'</b><small>'+esc(x.resource_type||'')+' · '+esc(x.created_at||'')+'</small></div>'+pill(x.outcome||'Recorded')+'</div>').join('')||'<div class="empty">No administrative activity has been recorded yet.</div>';
  return head('GLOBAL COMMAND CENTRE','Welcome to Navstar.','A central control room for your connected school network.','<button class="btn" data-action="add-school">＋ Register school</button>')+
  '<section class="hero"><div class="hero-copy"><div class="eyebrow">One platform · Many schools · Connected insight</div><h2>Manage the whole education network from one command centre.</h2><p>Monitor registered institutions and verified platform activity from the central database.</p></div></section>'+
  '<div class="small muted" style="margin:0 0 10px">'+(overviewLoading?'Loading live figures from the central database…':'Live figures from Navstar central database')+'</div><div class="stats">'+
  stat('Registered schools',Number(metrics.schools??schools.length).toLocaleString(),'Permanent central records','▦')+
  stat('Active schools',Number(metrics.activeSchools??active).toLocaleString(),'Approved and active','✓')+
  stat('Awaiting approval',pending.toLocaleString(),'School onboarding queue','◷')+
  stat('Registered learners',Number(metrics.learners||0).toLocaleString(),'Records in central database','♙')+
  '</div><div class="grid2">'+
  panel('School registrations','Actual school records created each month · last 12 months','<div class="chart">'+trend+'</div><div class="legend"><span><i class="dot"></i>Schools registered in the central database</span></div>')+
  panel('Onboarding activity','Most recently registered schools','<div class="list">'+recent+'</div>','<button class="btn light" data-page-go="schools">View schools</button>')+
  '</div><div class="grid3">'+
  panel('Platform governance','Current control areas','<div class="list"><div class="list-row"><b>Central database</b>'+pill(overviewMetrics?'Connected':'Checking')+'</div><div class="list-row"><b>Super Admin authentication</b>'+pill('Enabled')+'</div><div class="list-row"><b>AI services configuration</b>'+pill(settings.aiEnabled?'Enabled':'Disabled')+'</div></div>')+
  panel('Platform activity','Recent actions recorded in the central audit log','<div class="list">'+activity+'</div>')+
  panel('Quick actions','Common administrator tasks','<div class="quick-grid"><button class="quick" data-action="add-school"><b>＋ Register school</b><small>Onboard a new institution</small></button><button class="quick" data-page-go="users"><b>♙ Platform users</b><small>Review administrator accounts</small></button><button class="quick" data-page-go="communications"><b>✉ Communications</b><small>Manage school communications</small></button><button class="quick" data-page-go="academics"><b>▧ Academic standards</b><small>Review curriculum standards</small></button></div>')+

function schoolsPage(){let q=($('schoolSearch')?.value||'').toLowerCase(),sf=$('schoolStatus')?.value||'all',cf=$('schoolCounty')?.value||'all';let rows=schools.filter(s=>(!q||[s.name,s.code,s.county,s.email,s.contact].join(' ').toLowerCase().includes(q))&&(sf==='all'||s.status===sf)&&(cf==='all'||s.county===cf));return head('INSTITUTION MANAGEMENT','School directory','Register, review, activate, configure and monitor every school tenant.','<button class="btn" data-action="add-school">＋ Register school</button>')+'<div class="stats">'+stat('Total schools',schools.length,'All institution records','▦')+stat('Active',schools.filter(s=>s.status==='Active').length,'Access enabled','✓')+stat('Pending',schools.filter(s=>s.status==='Pending').length,'Awaiting approval','◷')+stat('Suspended',schools.filter(s=>s.status==='Suspended').length,'Access paused','⊘')+'</div>'+panel('Institution register','School profile, curriculum, subscription and tenant status','<div class="table-tools"><input class="field search" id="schoolSearch" placeholder="Search name, code, contact…" value="'+esc(q)+'"><select id="schoolStatus"><option value="all">All statuses</option>'+['Active','Pending','Suspended'].map(x=>'<option '+(sf===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select id="schoolCounty"><option value="all">All counties</option>'+counties.map(x=>'<option '+(cf===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="btn light" data-action="export-schools">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Institution</th><th>County</th><th>Category / levels</th><th>Curriculum</th><th>Plan</th><th>Status</th><th>Expiry</th><th>Actions</th></tr></thead><tbody>'+(rows.map(s=>'<tr><td><div class="school-name">'+esc(s.name)+'</div><div class="subline">'+esc(s.code||'No code')+' · '+esc(s.email||'No email')+' · School Admin: '+esc(s.schoolAdmin?.username||'Not assigned')+'</div></td><td>'+esc(s.county)+'</td><td>'+esc(s.category||s.level||'—')+'<div class="subline">'+esc((s.levels||[]).join(', '))+'</div></td><td>'+esc(s.curriculum||'CBC')+'</td><td>'+esc(s.plan||'Starter')+'</td><td>'+pill(s.status)+'</td><td>'+esc(s.expiry||'—')+'</td><td><div class="row-actions"><button class="tiny" data-action="school-details" data-id="'+s.id+'">Profile</button><button class="tiny" data-action="school-status" data-id="'+s.id+'">'+(s.status==='Active'?'Suspend':s.status==='Suspended'?'Activate':'Approve')+'</button></div></td></tr>').join('')||'<tr><td colspan="8"><div class="empty">No matching school records. Register a school to get started.</div></td></tr>')+'</tbody></table></div><div class="panel-pad small muted">School profiles include institution identity, ownership, contacts, offered levels, curriculum, users, learner/teacher counts, modules, subscription, usage, branding and activity summaries.</div>','')+'<div class="notice">A school is a separate tenant. In production, each tenant&#39;s branding, users, records, settings, documents and permissions must remain isolated from every other school.</div>'}

function billingPage(){let total=schools.reduce((a,s)=>a+(plans.find(p=>p.name===s.plan)?.price||0),0);return head('FINANCIAL OPERATIONS','Billing & payments','Monitor invoices, payment status, M-Pesa and bank reconciliation.')+'<div class="stats">'+stat('Indicative monthly plan value',money(total),'Active and pending records not reconciled','◈')+stat('Invoices issued','0','Backend not connected','▤')+stat('Payments received',money(0),'No live payment feed','✓')+stat('Outstanding balance',money(0),'Awaiting billing engine','◷')+'</div>'+panel('Payment channels','Planned integrations and reconciliation','<div class="list">'+['M-Pesa Daraja API','Bank transfer / statement import','Card and online payment gateway','Manual payment recording and receipt allocation'].map(x=>'<div class="list-row"><b>'+x+'</b>'+pill('Not connected')+'</div>').join('')+'</div>')+panel('Invoice register','Invoices and receipts will appear when billing services are connected','<div class="empty">No live invoices or payment records. Connect the billing backend before using this area for financial operations.</div>')}
function usersPage(){return head('IDENTITY & ACCESS','Platform users','View accounts assigned platform-wide roles. School users remain within their own school workspace.')+panel('Global administrator directory','Live accounts loaded from the central Navstar database','<div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Platform role</th><th>Status</th><th>Last sign-in</th></tr></thead><tbody>'+(users.map(u=>'<tr><td><b>'+esc(u.name)+'</b></td><td>'+esc(u.username)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.role)+'</td><td>'+pill(u.status)+'</td><td>'+esc(u.lastLogin||'—')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No global platform accounts found.</td></tr>')+'</tbody></table></div>')+'<div class="notice">This directory displays platform-level accounts only. School administrators and school staff are managed within their own school workspaces.</div>'}

sment workflows by curriculum, stage and school','<div class="list">'+['CBC competency / achievement-level descriptors','School-defined score-to-grade mappings','8-4-4 marks, grades and points templates','Assessment types: formative, summative, projects and practicals','Academic years, terms, exam sessions and report-card templates','Moderation, approval and publication workflows'].map(x=>'<div class="list-row"><b>'+x+'</b>'+pill('Template scope')+'</div>').join('')+'</div>')}

function analyticsPage(){return head('PLATFORM INTELLIGENCE','Platform analytics','Track school growth, engagement, subscriptions, storage, AI usage and operational performance.')+'<div class="stats">'+stat('Schools',schools.length,'Current local directory','▦')+stat('Active tenants',schools.filter(s=>s.status==='Active').length,'Local status count','✓')+stat('Platform users',users.length,'Local admin directory','♙')+stat('Announcements',messages.length,'Local message drafts','✉')+'</div><div class="grid2">'+panel('Tenant distribution by county','School counts from local directory','<div class="list">'+(counties.map(c=>({c,n:schools.filter(s=>s.county===c).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,10).map(x=>'<div class="list-row"><b>'+x.c+'</b><span>'+x.n+'</span></div>').join('')||'<div class="empty">Register schools to see geographic distribution.</div>')+'</div>')+panel('Plan mix','School subscriptions by selected plan','<div class="list">'+plans.map(p=>'<div class="list-row"><b>'+p.name+'</b><span>'+schools.filter(s=>s.plan===p.name).length+' schools</span></div>').join('')+'</div>')+'</div><div class="notice">This page currently reports only records stored in this browser. Production analytics must use aggregated tenant-safe metrics and must not expose one school’s identifiable learner records to another school.</div>'}
function securityPage(){return head('TRUST & GOVERNANCE','Security & audit','Review administrative activity and configure the controls required for a secure multi-tenant platform.')+panel('Security control checklist','Production controls to implement before onboarding live schools','<div class="list">'+['Secure sign-in, MFA for privileged administrators and account recovery','Role-based access control enforced server-side','Tenant isolation on every database query and file operation','Encryption in transit and at rest; managed secrets','Session expiry, device/session management and rate limiting','Audit trails for approvals, exports, billing and permission changes','Data retention, privacy requests and incident response','Backups, restore tests and security monitoring'].map(x=>'<div class="list-row"><b>'+x+'</b>'+pill('Implementation required')+'</div>').join('')+'</div>')+panel('Administrative audit log','Authenticated administrative events recorded in central D1','<div class="table-wrap"><table><thead><tr><th>Action</th><th>Details</th><th>Date / time</th></tr></thead><tbody>'+(audit.map(a=>'<tr><td>'+esc(a.action)+'</td><td>'+esc(a.detail)+'</td><td>'+esc(a.at)+'</td></tr>').join('')||'<tr><td colspan="3" class="empty">No activity logged yet.</td></tr>')+'</tbody></table></div>')+'<div class="notice warn">Audit events are stored in the central D1 database and are not dependent on this browser.</div>'}

const defaultGuide={title:"Navstar Analytics · School Management System User Guide",introduction:"A practical guide to setting up and using your Navstar school workspace. The School Administrator should review the school profile, academic calendar, users and permissions before entering live records.",sections:[{heading:"1. Signing in securely",body:"Open the official Navstar login page. Sign in with your username and password. Usernames are used for login; your registered email is used for password recovery and important account notices. Never share your password or one-time verification codes."},{heading:"2. First-time school setup",body:"Confirm the school name, contact details, curriculum and levels offered. Set the current academic year and create the terms with their correct dates. Configure grades, streams and learning areas before enrolling learners."},{heading:"3. Users, roles and permissions",body:"Create individual accounts for staff, teachers, learners and parents. Assign only the roles needed for each person. A user may hold more than one role; the workspace combines the permissions from those roles. Review accounts regularly and disable access when a person leaves."},{heading:"4. Learner admissions and enrolment",body:"Register each learner with a unique admission number and accurate identity details. Enrol the learner into the correct academic year, grade and stream. Bulk registration and class-enrolment templates are available in the learner workspace. Check imported rows and resolve validation errors before retrying."},{heading:"5. Staff and teacher allocations",body:"Maintain staff profiles and assign teaching responsibilities. Allocate teachers to the correct academic year, term, grade, stream and learning areas. Keep allocations current so attendance, assessments and timetables use the right teaching groups."},{heading:"6. Attendance management",body:"Select the correct date, academic period and class. Record attendance promptly and review the class register for missing or duplicate entries. Correct mistakes using the authorised attendance workflow."},{heading:"7. Timetable planning",body:"Open the Timetable workspace. Set the academic year, term, school days, lesson periods, breaks and lunch. Configure double-period blocks for subjects that must run simultaneously, including pathway or option groups. Generate the timetable, review teacher, class and room conflicts, then publish the approved version."},{heading:"8. Assessments, grading and report cards",body:"Set up the school's grading scheme and grade boundaries. Create assessments for the correct learning areas and class groups, enter marks and check results. Generate report cards for the intended academic year and term, review them carefully and print or save approved copies."},{heading:"9. Finance and subscription payments",body:"Record school fees, invoices and receipts in the appropriate finance workspace. Check payment status before issuing receipts. Navstar subscription charges are separate from learner fee transactions. Use the online payment option only when the payment provider confirms the transaction."},{heading:"10. Reports, communication and support",body:"Use role-authorised reports to monitor attendance, learner progress, finance and school operations. Raise a support ticket from the school workspace when help is needed. Include the affected module, what you were doing and the exact error message; do not include passwords or private learner information unnecessarily."},{heading:"11. Data protection and good practice",body:"Keep user accounts personal, review permissions, protect devices and sign out on shared computers. Check school and academic scope before saving records. Retain authorised backups and never upload sensitive information to an unapproved location."}]};

function wireOutputTemplates(){const list=$('outputTemplateList');if(!list)return;let selected=null;let templates=[];const notice=$('outputTemplateNotice');const editor=$('outputTemplateJson');function choose(t){selected=t;$('outputTemplateName').value=t.name;editor.value=JSON.stringify(JSON.parse(t.template_json||'{}'),null,2);$('outputTemplateActive').checked=Number(t.is_active)===1;list.querySelectorAll('.output-choice').forEach(b=>b.classList.toggle('active',b.dataset.key===t.template_key))}fetch('/api/output-templates',{credentials:'same-origin'}).then(r=>r.json().then(d=>{if(!r.ok)throw new Error(d.error||'Could not load templates');return d})).then(d=>{templates=d.templates||[];list.innerHTML=templates.map(t=>'<button class="output-choice" type="button" data-key="'+esc(t.template_key)+'"><b>'+esc(t.name)+'</b><small>'+esc(t.category)+' · v'+esc(t.version)+'</small><small>'+esc(t.description)+'</small></button>').join('');list.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>choose(templates.find(t=>t.template_key===b.dataset.key)));if(templates.length)choose(templates.find(t=>t.template_key==='report_card')||templates[0]);else list.textContent='No templates have been seeded. Apply migration 0003.'}).catch(e=>{list.textContent=e.message});$('downloadOutputTemplate').onclick=()=>{if(!selected)return;let cfg={};try{cfg=JSON.parse(selected.template_json||'{}')}catch{}if(cfg.format!=='csv'||!Array.isArray(cfg.columns)){notice.textContent='This output is not a CSV import template.';return}const sample=cfg.columns.map(k=>({admission_number:'NAV-2026-0001',first_name:'Jane',middle_name:'',last_name:'Wanjiku',gender:'Female',date_of_birth:'2014-05-12',status:'active',pathway:'',academic_year:'2026',grade:'Grade 7',stream:'7 East',username:'teacher01',staff_number:'T-001',department:'Languages',employment_type:'Permanent',employment_status:'active',hire_date:'2026-01-01',assessment_id:'ASSESSMENT-ID',score:'80',feedback:'Good progress'})[k]??'');const csv=[cfg.columns,sample].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='navstar-'+selected.template_key+'-template.csv';a.click();URL.revokeObjectURL(url);notice.textContent='CSV template downloaded.'};
$('printOutputPreview').onclick=()=>{const source=$('reportCardPreview');if(!source)return;const w=window.open('','_blank');if(!w){notice.textContent='Allow pop-ups to preview this output.';return}w.document.write('<!doctype html><html><head><title>Navstar report card sample</title><style>body{font-family:Arial;margin:30px;color:#17243a}.report-preview{max-width:760px;margin:auto}.rp-head{text-align:center;border-bottom:2px solid #1c4779;padding-bottom:12px}.rp-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;font-size:11px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #d5deea;padding:7px;text-align:left}.rp-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:35px;font-size:10px}.rp-sign span{border-top:1px solid #52647a;padding-top:6px}</style></head><body>'+source.innerHTML+'</body></html>');w.document.close();w.focus();w.print()};

function wireSystemGuide(){let guide=JSON.parse(JSON.stringify(defaultGuide));const host=$('guideSections');function renderSections(){host.innerHTML=guide.sections.map((x,i)=>'<div class="panel"><div class="panel-pad"><div class="form-field"><label>Section heading</label><input class="field" data-guide-heading="'+i+'" maxlength="140" value="'+esc(x.heading)+'"></div><div class="form-field"><label>Instructions</label><textarea class="field" data-guide-body="'+i+'" rows="4" maxlength="7000">'+esc(x.body)+'</textarea></div></div></div>').join('')}function readFields(){guide.title=$('guideTitle').value.trim();guide.introduction=$('guideIntro').value.trim();host.querySelectorAll('[data-guide-heading]').forEach(el=>guide.sections[Number(el.dataset.guideHeading)].heading=el.value);host.querySelectorAll('[data-guide-body]').forEach(el=>guide.sections[Number(el.dataset.guideBody)].body=el.value)}fetch('/api/platform-controls',{credentials:'same-origin'}).then(r=>r.json().then(d=>{if(!r.ok)throw new Error(d.error||'Could not load guide');return d})).then(d=>{guide={...guide,...(d.settings?.system_guide||{})};$('guideTitle').value=guide.title;$('guideIntro').value=guide.introduction;renderSections()}).catch(e=>{$('guideStatus').textContent=e.message;$('guideTitle').value=guide.title;$('guideIntro').value=guide.introduction;renderSections()});$('systemGuideForm').onsubmit=async e=>{e.preventDefault();readFields();const b=e.target.querySelector('[type=submit]');b.disabled=true;try{const r=await fetch('/api/platform-controls',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'system_guide',value:guide})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Guide could not be saved');$('guideStatus').textContent='Saved to central D1.'}catch(x){$('guideStatus').textContent=x.message}finally{b.disabled=false}};$('guidePdf').onclick=async()=>{readFields();const pop=window.open('','_blank');if(!pop){$('guideStatus').textContent='Allow pop-ups to create the PDF.';return}let brand={name:'Navstar Analytics',tagline:'Smart School Management & Education Analytics',address:'',city:'',county:'',phone:'',email:'',website:'',logoUrl:''};try{const r=await fetch('/api/branding',{credentials:'same-origin'});const d=await r.json();if(d.branding)brand={...brand,...d.branding}}catch{}const escHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sections=guide.sections.map(x=>'<section><h2>'+escHtml(x.heading)+'</h2><p>'+escHtml(x.body).replace(/\n/g,'<br>')+'</p></section>').join('');pop.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+escHtml(guide.title)+'</title><style>@page{size:A4;margin:18mm 17mm 20mm}*{box-sizing:border-box}body{font:11pt/1.6 Arial,sans-serif;color:#1b2a41;margin:0}.letter{display:flex;align-items:center;gap:18px;border-bottom:4px solid #123b78;padding:0 0 16px;margin-bottom:24px}.letter img{max-width:110px;max-height:70px;object-fit:contain}.brand{font-size:20pt;font-weight:800;color:#123b78}.tag{font-size:9pt;color:#5c6b80}.contact{font-size:8pt;color:#5c6b80;margin-top:4px}.doc-title{font-size:21pt;color:#102e5d;margin:22px 0 8px}.intro{font-size:11pt;color:#40516a;background:#f2f6fc;padding:15px;border-left:4px solid #2b69b2;margin:16px 0 24px}h2{font-size:13pt;color:#123b78;margin:22px 0 6px;border-bottom:1px solid #dce4ef;padding-bottom:5px}p{margin:0 0 12px;white-space:normal}footer{position:fixed;bottom:-12mm;left:0;right:0;border-top:1px solid #dce4ef;padding-top:6px;font-size:8pt;color:#6b7890;text-align:center}@media print{section{break-inside:avoid}}</style></head><body><header class="letter">'+(brand.logoUrl?'<img src="'+escHtml(brand.logoUrl)+'">':'')+'<div><div class="brand">'+escHtml(brand.name)+'</div><div class="tag">'+escHtml(brand.tagline)+'</div><div class="contact">'+[brand.address,brand.city,brand.county,brand.phone,brand.email,brand.website].filter(Boolean).map async function loadSchoolBillingFromDatabase(){
  await Promise.all(schools.map(async school=>{
    try{
      const data=await schoolApi("/api/data/subscriptions?schoolId="+encodeURIComponent(school.id));
      const rows=data.records||[];
      rows.sort((a,b)=>String(b.updated_at||b.created_at||"").localeCompare(String(a.updated_at||a.created_at||"")));
      const row=rows[0];
      if(!row)return;
      const assignedPlan=plans.find(p=>p.id===row.plan_id);
      if(assignedPlan){school.plan=assignedPlan.name;const planModules=Array.isArray(assignedPlan.modules)?assignedPlan.modules:String(assignedPlan.modules||"").split(/[,;+]/).map(x=>x.trim()).filter(Boolean);school.modules=[...new Set([...modulesForLevels(school.levels||[]),...planModules])];}
      school.learnerCount=Number(row.learner_count||0);
      school.billing={subscriptionId:row.id,billingModel:row.billing_model_override,rate:row.rate_override_kes,learnerCountBasis:row.learner_count_basis||"active",discount:Number(row.discount_percent||0),cycleStart:row.contract_start_date||"",nextDue:row.next_due_date||"",paymentTerms:row.payment_terms||"",paymentMethod:row.preferred_payment_method||"",status:row.status||"trial"};
    }catch(error){console.warn("Could not load subscription for school",school.id,String(error?.message||error))}
  }));
}

    field("Payment terms","paymentTerms","e.g. Due within 14 days","text",billing.paymentTerms||"Due within 14 days")+
    selectFieldRich("Subscription status","status",statuses,billing.status||"trial")+
    '</div>',async d=>{
      const selected=plans.find(x=>x.name===d.get("plan"));if(!selected?.id){toast("Select a plan saved in D1 first.");return}

      if(discount<0||discount>100){toast("Discount must be between 0 and 100%.");return}
      const billingModel=model==="plan"?null:model;
      const effectiveModel=billingModel||selected.billingModel||"flat_school_month";
      const effectiveRate=rate??selected.rate??selected.price??0;
      const base=effectiveModel.startsWith("per_learner")?learnerCount*effectiveRate:effectiveModel==="custom"?0:effectiveRate;
      const estimated=Math.round(base*(1-discount/100)*100)/100;
      const payload={school_id:school.id,plan_id:selected.id,billing_model_override:billingModel,rate_override_kes:rate,learner_count:learnerCount,learner_count_basis:d.get("countBasis"),discount_percent:discount,contract_start_date:d.get("cycleStart")||null,next_due_date:d.get("nextDue")||null,preferred_payment_method:d.get("paymentMethod")==="Use plan default"?(selected.paymentMethods?.[0]||"mpesa"):d.get("paymentMethod"),payment_terms:d.get("paymentTerms"),status:d.get("status"),estimated_amount_kes:estimated};
      const button=$("saveModal");if(button){button.disabled=true;button.textContent="Saving subscription…"}
      try{
        let result;
        if(billing.subscriptionId)result=await schoolApi("/api/data/subscriptions/"+encodeURIComponent(billing.subscriptionId)+"?schoolId="+encodeURIComponent(school.id),{method:"PATCH",body:JSON.stringify(payload)});
        else result=await schoolApi("/api/data/subscriptions",{method:"POST",body:JSON.stringify(payload)});
        school.plan=selected.name;school.learnerCount=learnerCount;school.billing={subscriptionId:result.record?.id||billing.subscriptionId,billingModel,rate,learnerCountBasis:payload.learner_count_basis,discount,cycleStart:payload.contract_start_date||"",nextDue:payload.next_due_date||"",paymentTerms:payload.payment_terms,paymentMethod:payload.preferred_payment_method,status:payload.status};
        closeModal();render();toast("School subscription saved permanently in D1.");
      }catch(error){toast(error.message||"Subscription could not be saved.");if(button){button.disabled=false;button.textContent="Save record"}}
    });
};

async function loadBillingRecordsFromDatabase(){

      schoolApi("/api/data/invoices?schoolId="+encodeURIComponent(school.id)),

    ]);
    return {school,invoices:invoices.records||[],payments:payments.records||[]};
  }));
  d1Invoices=collected.flatMap(x=>x.invoices.map(row=>({...row,school_name:x.school.name,school_code:x.school.code})));
  d1Payments=collected.flatMap(x=>x.payments.map(row=>({...row,school_name:x.school.name,school_code:x.school.code,invoice_number:d1Invoices.find(i=>i.id===row.invoice_id)?.invoice_number||"—"})));

function gradingForm(item){const defaultBands=[{min:80,max:100,grade:'EE',descriptor:'Exceeding expectation'},{min:50,max:79,grade:'ME',descriptor:'Meeting expectation'},{min:30,max:49,grade:'AE',descriptor:'Approaching expectation'},{min:0,max:29,grade:'BE',descriptor:'Below expectation'}];const bands=item?.bands||defaultBands;const body='<div class="form-grid">'+field('Framework name *','name','e.g. CBC achievement framework','text',item?.name||'')+selectField('Curriculum','curriculum',['Kenyan CBC','Kenyan 8-4-4','International / Cambridge','Custom school curriculum'],item?.curriculum||'Kenyan CBC')+selectField('Grade / stage','stage',['PP1','PP2','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7','Grade 8','Grade 9','Grade 10','Grade 11','Grade 12','Form 1','Form 2','Form 3','Form 4','All applicable stages'],item?.stage||'Grade 10')+'<div class="form-field full"><label>Assessment types (comma-separated)</label><input class="field" name="assessments" value="'+esc(item?.assessments||'CAT, Project, Practical, End-term examination')+'" placeholder="CAT, Project, Practical, End-term examination"></div><div class="form-field full"><label>Achievement bands (JSON array)</label><textarea class="field" name="bands" rows="7" style="width:100%;font-family:monospace">'+esc(JSON.stringify(bands,null,2))+'</textarea><small>Each band requires min, max, grade and descriptor. Scores must be within 0–100 and ranges must not overlap.</small></div><div class="form-field full"><label>Report-card grading rule</label><textarea class="field" name="reportRule" rows="2" style="width:100%">'+esc(item?.reportRule||'Report achievement by learning area; include teacher comments and overall learner progress.')+'</textarea></div>'+selectField('Template status','status',['Draft','Active','Archived'],item?.status||'Draft')+'</div><div class="notice">Example bands are starter values only. Adapt them to the approved curriculum, assessment type and school policy.</div>';openModal((item?'Edit ':'Add ')+'grading framework',body,d=>{const name=d.get('name')?.trim();if(!name){toast('Framework name is required.');return}let parsed;try{parsed=JSON.parse(d.get('bands')||'[]')}catch{toast('Achievement bands must be valid JSON.');return}if(!Array.isArray(parsed)||!parsed.length||parsed.some(b=>!Number.isFinite(Number(b.min))||!Number.isFinite(Number(b.max))||Number(b.min)<0||Number(b.max)>100||Number(b.min)>Number(b.max)||!String(b.grade||'').trim()||!String(b.descriptor||'').trim())){toast('Each band needs valid 0–100 min/max scores, grade and descriptor.');return}const sorted=parsed.map(b=>({...b,min:Number(b.min),max:Number(b.max),grade:String(b.grade).trim(),descriptor:String(b.descriptor).trim()})).sort((a,b)=>a.min-b.min);for(let i=1;i<sorted.length;i++){if(sorted[i].min<=sorted[i-1].max){toast('Achievement score ranges overlap. Adjust the band boundaries.');return}}const rec={id:item?.id||'g'+Date.now(),name,curriculum:d.get('curriculum'),stage:d.get('stage'),assessments:d.get('assessments')?.trim()||'',bands:sorted,reportRule:d.get('reportRule')?.trim()||'',status:d.get('status')};const duplicate=extra.gradingTemplates.some(x=>x.id!==rec.id&&x.curriculum===rec.curriculum&&x.stage===rec.stage&&x.name.toLowerCase()===name.toLowerCase());if(duplicate){toast('A framework with this name, curriculum and stage already exists.');return}if(item){const ix=extra.gradingTemplates.findIndex(x=>x.id===item.id);if(ix>=0)extra.gradingTemplates[ix]=rec}else extra.gradingTemplates.unshift(rec);saveExtra();log(item?'Grading framework updated':'Grading framework created',name);closeModal();render();toast('Grading framework saved locally.')})}
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='grading-add')gradingForm(null);if(a==='grading-edit')gradingForm(extra.gradingTemplates.find(x=>x.id===id));if(a==='grading-delete'){const x=extra.gradingTemplates.find(x=>x.id===id);if(x&&confirm('Delete this grading framework?')){extra.gradingTemplates=extra.gradingTemplates.filter(y=>y.id!==id);saveExtra();log('Grading framework deleted',x.name);render()}}if(a==='grading-export'){const keys=['name','curriculum','stage','assessments','bands','reportRule','status'];downloadText('navstar-grading-frameworks.csv',[keys.join(','),...extra.gradingTemplates.map(x=>keys.map(k=>'"'+String(k==='bands'?JSON.stringify(x[k]||[]):x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\\r\\n'),'text/csv')}});

cial Sciences','Arts & Sports Science','All pathways'].includes(rec.pathway)){toast('Select a Senior School pathway for Grades 10–12.');return}if(!senior&&rec.pathway!=='Not applicable'&&rec.pathway!=='All pathways'){toast('Pathway-specific mappings are reserved for Senior School Grades 10–12.');return}const duplicate=extra.learning.some(x=>x.id!==rec.id&&String(x.name||'').toLowerCase()===rec.name.toLowerCase()&&x.curriculum===rec.curriculum&&x.stage===rec.stage&&x.pathway===rec.pathway);if(duplicate){toast('This learning area already has the same curriculum, stage and pathway mapping.');return}}const arr=kind==='regions'?extra.regions:kind==='billing'?extra.invoices:kind==='academics'?extra.learning:kind==='ai'?extra.aiRules:kind==='integrations'?extra.integrations:extra.incidents;if(item){const ix=arr.findIndex(x=>x.id===item.id);if(ix>=0)arr[ix]=rec}else arr.unshift(rec);saveExtra();log((item?'Updated ':'Created ')+w.title,rec[fields[0][0]]);closeModal();render();toast('Record saved locally.')})}

function modulesForLevels(levels){const set=new Set(["Core","Learners","Staff & HR","Academics","Examinations","Reports","Parent Portal"]);if(levels.some(x=>/^Grade (7|8|9)$/.test(x)))["Junior School","Pathway Planning"].forEach(x=>set.add(x));if(levels.some(x=>/^Grade (10|11|12)$/.test(x)))["Senior School","Pathway Planning","AI Analytics"].forEach(x=>set.add(x));if(levels.some(x=>/^Form /.test(x)))["Secondary School"].forEach(x=>set.add(x));if(levels.length)set.add("Attendance");return [...set]}
const localSchoolDetails=schoolDetails;

  const schoolUsersPanel=document.createElement("section");schoolUsersPanel.className="panel";schoolUsersPanel.style.cssText="padding:16px;margin-top:16px";
  schoolUsersPanel.innerHTML="<h3 style='margin:0 0 6px'>Add School User</h3><p class='muted'>Create teachers, staff, parents, learners and other school accounts directly from Super Admin. Each school can have only one School Administrator.</p><div class='form-grid'><div class='form-field'><label>Full name *</label><input id='saUserFullName' maxlength='120'></div><div class='form-field'><label>Username *</label><input id='saUserUsername' minlength='3' maxlength='32' pattern='[A-Za-z0-9._-]'><small id='saUserUsernameStatus' class='muted'></small></div><div class='form-field'><label>Email *</label><input id='saUserEmail' type='email'></div><div class='form-field'><label>Phone</label><input id='saUserPhone' type='tel'></div><div class='form-field'><label>Role *</label><select id='saUserRole'><option value='teacher'>Teacher</option><option value='class_teacher'>Class Teacher</option><option value='principal'>Principal / Headteacher</option><option value='deputy_principal'>Deputy Principal</option><option value='director_of_studies'>Director of Studies</option><option value='deputy_director_of_studies'>Deputy Director of Studies</option><option value='head_of_department'>Head of Department</option><option value='examinations_officer'>Examinations Officer</option><option value='bursar_accountant'>Bursar / Accountant</option><option value='hr_administrator'>HR Administrator</option><option value='admissions_registrar'>Admissions / Registrar</option><option value='librarian'>Librarian</option><option value='school_owner'>School Owner / Director</option><option value='parent'>Parent / Guardian</option><option value='student'>Learner</option></select></div><div class='form-field'><label>Linked learner admission numbers (parent/learner)</label><input id='saUserLearners' placeholder='NS-001, NS-002'></div><div class='form-field'><label>Staff number (optional)</label><input id='saUserStaffNo'></div><div class='form-field'><label>Department (optional)</label><input id='saUserDepartment'></div></div><button type='button' id='saCreateSchoolUser' class='btn' style='margin-top:12px'>Create School User</button><div id='saUserFeedback' class='muted' style='margin-top:8px'></div>";
  body.appendChild(schoolUsersPanel);
  let schoolUserUsernameTimer=null;$("saUserUsername").addEventListener("input",()=>{clearTimeout(schoolUserUsernameTimer);const value=$("saUserUsername").value.trim().toLowerCase(),status=$("saUserUsernameStatus");status.textContent="";if(!/^[a-z0-9._-]{3,32}$/.test(value)){status.textContent="Use 3–32 letters, numbers, dots, underscores or hyphens.";return}status.textContent="Checking…";schoolUserUsernameTimer=setTimeout(async()=>{try{const result=await schoolApi("/api/auth/username-availability",{method:"POST",body:JSON.stringify({username:value})});status.textContent=result.available?"✓ Username is available.":"✕ Username already taken. Choose another.";status.style.color=result.available?"#16845b":"#b33b3b"}catch(error){status.textContent=error.message||"Could not check username."}},350)});
  $("saCreateSchoolUser").addEventListener("click",async()=>{const payload={fullName:$("saUserFullName").value.trim(),username:$("saUserUsername").value.trim(),email:$("saUserEmail").value.trim(),phone:$("saUserPhone").value.trim(),roleKey:$("saUserRole").value,learnerAdmissionNumbers:$("saUserLearners").value,staffNumber:$("saUserStaffNo").value,department:$("saUserDepartment").value};const feedback=$("saUserFeedback"),button=$("saCreateSchoolUser");if(!payload.fullName||!payload.username||!payload.email){feedback.textContent="Enter the user's name, username and email.";return}button.disabled=true;button.textContent="Creating…";try{const result=await schoolApi("/api/schools/"+encodeURIComponent(id)+"/users",{method:"POST",body:JSON.stringify(payload)});feedback.textContent="Created "+result.user.fullName+" ("+result.user.username+"). "+(result.emailDelivery==="sent"?"Welcome email sent.":result.emailDelivery==="failed"?"Email delivery failed — please verify the email configuration.":"Email service not configured.");toast("School user created successfully. "+(result.emailDelivery==="sent"?"Login details emailed.":"Email delivery: "+result.emailDelivery));}catch(error){feedback.textContent=error.message||"Could not create school user."}finally{button.disabled=false;button.textContent="Create School User"}});

  $("saveSchoolAdmin").addEventListener("click",async()=>{
    const payload={fullName:$("schoolAdminFullName").value.trim(),username:$("schoolAdminUsername").value.trim(),email:$("schoolAdminEmail").value.trim(),phone:$("schoolAdminPhone").value.trim()};

/* Intercept school status changes before the old browser-only prototype handler. */
$("view").addEventListener("click",async e=>{
  const button=e.target.closest('[data-action="school-status"]');if(!button)return;
  e.preventDefault();e.stopImmediatePropagation();
  const school=schools.find(x=>x.id===button.dataset.id);if(!school)return;
  const next=school.status==="Active"?"Suspended":"Active";
  button.disabled=true;
  try{const result=await schoolApi("/api/schools/"+encodeURIComponent(school.id),{method:"PATCH",body:JSON.stringify({status:next})});Object.assign(school,result.school);render();toast("School status saved to the central database.");}
  catch(error){button.disabled=false;toast(error.message||"School status could not be updated.");}
},true);

/* Super Admin account menu and secure account management. */
let signedInUser=null;
async function loadSignedInUser(){
  const response=await fetch('/api/auth/me',{credentials:'same-origin'});
  if(!response.ok){location.replace('/login.html');return}
  const data=await response.json();signedInUser=data.user;
  $('accountButton').innerHTML=signedInUser.profilePhotoUrl?'<img src="'+esc(signedInUser.profilePhotoUrl)+'?v='+Date.now()+'" alt="Profile picture">':((signedInUser.fullName||'SA').split(/\\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'SA');
  $('accountName').textContent=signedInUser.fullName||'Super Admin';
  $('accountEmail').textContent=signedInUser.email||signedInUser.username||'Platform owner';
}

      const payload={fullName:d.get('fullName'),email:d.get('email'),phone:d.get('phone'),designation:d.get('designation'),organisationName:d.get('organisationName')};

 const b=e.target.closest('#runAiDiagnostics,[data-support-reply],[data-support-status]');if(!b)return;

$('changePassword').addEventListener('click',()=>{
  $('accountMenu').classList.remove('open');
  openModal('Change your password','<div class="form-grid">'+field('Current password *','currentPassword','Enter current password','password')+field('New password *','newPassword','At least 6 characters','password')+field('Confirm new password *','confirmPassword','Repeat new password','password')+'</div><div id="passwordMatchStatus" class="notice" style="margin-top:0">Enter the new password twice to check that they match.</div><div class="notice">Use at least 6 characters and any 3 of: uppercase, lowercase, number and special character. Other active sessions will be signed out.</div>',async d=>{
    const payload={currentPassword:d.get('currentPassword'),newPassword:d.get('newPassword'),confirmPassword:d.get('confirmPassword')};
    if(payload.newPassword!==payload.confirmPassword){toast('The new passwords do not match.');return}
    try{const r=await fetch('/api/auth/change-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok||!data.ok){toast(data.error||'Password could not be changed.');return}closeModal();toast('Password changed successfully.')}catch{toast('Password change failed. Please try again.')}
  });
  ['currentPassword','newPassword','confirmPassword'].forEach(name=>{
    const input=$('modalBody').querySelector('[name="'+name+'"]');if(!input)return;
    input.minLength=6;input.autocomplete=name==='currentPassword'?'current-password':'new-password';
    const wrap=document.createElement('div');wrap.style.position='relative';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);input.style.paddingRight='62px';
    const toggle=document.createElement('button');toggle.type='button';toggle.textContent='Show';toggle.style.cssText='position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#3678f6;font-weight:700;cursor:pointer';
    toggle.addEventListener('click',()=>{input.type=input.type==='password'?'text':'password';toggle.textContent=input.type==='password'?'Show':'Hide'});wrap.appendChild(toggle);
  });
  const next=$('modalBody').querySelector('[name="newPassword"]');
  const confirm=$('modalBody').querySelector('[name="confirmPassword"]');
  const matchStatus=$('passwordMatchStatus');
  if(next)next.pattern='(?:(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])|(?=.*[A-Z])(?=.*[a-z])(?=.*[^A-Za-z0-9])|(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9])|(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9])).{6,128}';
  const updateMatch=()=>{if(!confirm.value){matchStatus.textContent='Enter the new password twice to check that they match.';matchStatus.style.color='';return}if(next.value===confirm.value){matchStatus.textContent='✓ New passwords match';matchStatus.style.color='#16845b'}else{matchStatus.textContent='✕ New passwords do not match';matchStatus.style.color='#c04d58'}};

/* Legacy browser-data recovery: read-only scan, immutable D1 archive, then safe migration of supported records. */
let legacyRecoveryRecords=[],legacyRecoveryScanDone=false,legacyRecoveryArchived=false;
function stripRecoverySecrets(value){if(Array.isArray(value))return value.map(stripRecoverySecrets);if(value&&typeof value==='object'){const out={};for(const [key,item] of Object.entries(value)){if(/password|passwd|token|secret|otp|credential|api.?key|private.?key|access.?key|session/i.test(key))continue;out[key]=stripRecoverySecrets(item)}return out}return value}
function recoveryPage(){
 return head('BUSINESS CONTINUITY','Backup & recovery','Capture legacy browser records, preserve them in central D1, and safely migrate supported records.')+
 panel('Step 1 · Scan this browser','Read old Navstar local records without changing or deleting them','<div class="panel-pad"><p class="muted">This scans the browser profile and current Navstar site origin for older prototype records. Authentication tokens, passwords, OTPs and secret-like keys are excluded.</p><button class="btn" data-action="recovery-scan">Scan browser records</button> <button class="btn light" data-action="recovery-download" '+(legacyRecoveryScanDone?'':'disabled')+'>Download recovery JSON</button><div id="recoveryScanResult" class="notice">Not scanned yet. Use the same browser and profile where the old Navstar records were created.</div></div>')+
 panel('Step 2 · Preserve in D1','Create an untouched recovery snapshot before migrating anything','<div class="panel-pad"><button class="btn green" data-action="recovery-archive" '+(legacyRecoveryScanDone&&legacyRecoveryRecords.length?'':'disabled')+'>Save scanned records to Cloudflare D1</button> <label class="btn light" for="recoveryFile" style="display:inline-block;cursor:pointer">Archive an old JSON backup</label><input id="recoveryFile" type="file" accept="application/json,.json" hidden><div class="notice warn">Archiving preserves the original records as a separate recovery snapshot. It does not overwrite current school records or create fake user accounts.</div><div id="recoveryArchiveStatus" class="muted small"></div></div>')+
 panel('Step 3 · Restore supported records','Migrate only records with a valid destination and required details','<div class="panel-pad"><button class="btn" data-action="recovery-migrate" '+(legacyRecoveryScanDone&&legacyRecoveryRecords.length?'':'disabled')+'>Migrate supported schools and settings to D1</button><div id="recoveryMigrationStatus" class="notice">First scan and save a recovery snapshot. Schools without a valid official email or county will remain safely in the archive for manual review.</div></div>')+
 panel('D1 recovery archive','Previously captured recovery snapshots','<div class="panel-pad"><button class="btn light" data-action="recovery-refresh">Refresh archive list</button><div id="recoveryArchiveList" class="muted small">Loading archives…</div></div>');
}

async function scanLegacyBrowser(){
 const records=[],excluded=[];
 for(let i=0;i<localStorage.length;i++){
  const key=localStorage.key(i);if(!key)continue;
  if(/auth|session|token|password|passwd|otp|secret|csrf|credential|api.?key|private.?key|access.?key/i.test(key)){excluded.push(key);continue}
  const raw=localStorage.getItem(key);if(raw===null)continue;
  let value=raw,encoding='text';try{value=JSON.parse(raw);encoding='json'}catch{}
  records.push({key,encoding,value:stripRecoverySecrets(value),characterCount:raw.length});
 }
 legacyRecoveryRecords=records;legacyRecoveryScanDone=true;legacyRecoveryArchived=false;
 const result=$('recoveryScanResult');if(result)result.textContent='Found '+records.length+' browser record(s) ('+records.reduce((n,r)=>n+r.characterCount,0).toLocaleString()+' characters). '+excluded.length+' sensitive/authentication-like key(s) excluded. Original browser data was not changed.';
 const archive=$('recoveryArchiveStatus');if(archive)archive.textContent='Ready to create a D1 snapshot.';
 const download=$('view').querySelector('[data-action="recovery-download"]'),save=$('view').querySelector('[data-action="recovery-archive"]'),migrate=$('view').querySelector('[data-action="recovery-migrate"]');
 if(download)download.disabled=!records.length;if(save)save.disabled=!records.length;if(migrate)migrate.disabled=true;
 await refreshRecoveryArchives();
}
function downloadRecoveryFile(name,data){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function refreshRecoveryArchives(){
 const host=$('recoveryArchiveList');if(!host)return;
 try{const d=await schoolApi('/api/recovery');host.innerHTML=(d.archives||[]).length?'<div class="table-wrap"><table><thead><tr><th>Captured</th><th>Source</th><th>Records</th><th>Size</th><th>Action</th></tr></thead><tbody>'+(d.archives||[]).map(a=>'<tr><td>'+esc(a.created_at)+'</td><td>'+esc(a.source)+'</td><td>'+Number(a.record_count||0)+'</td><td>'+Number(a.byte_count||0).toLocaleString()+' bytes</td><td><button class="tiny" data-action="recovery-load-archive" data-id="'+esc(a.id)+'">Load to restore</button> <button class="tiny" data-action="recovery-download-archive" data-id="'+esc(a.id)+'">Download</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No recovery archives saved in D1 yet.</div>'}
 catch(error){host.textContent=error.message||'Could not load D1 recovery archives.'}
}
async function archiveRecoveryRecords(records,source){
 const result=await schoolApi('/api/recovery',{method:'POST',body:JSON.stringify({source,records})});
 const status=$('recoveryArchiveStatus');if(status)status.textContent=result.message+' Archive ID: '+result.archive.id;
 legacyRecoveryArchived=true;const migrate=$('view').querySelector('[data-action="recovery-migrate"]');if(migrate)migrate.disabled=false;
 await refreshRecoveryArchives();return result;
}
async function migrateLegacyRecords(){
 const status=$('recoveryMigrationStatus');if(status)status.textContent='Checking recoverable records…';
 let schoolCandidates=[];
 for(const r of legacyRecoveryRecords){
  if(r.key===KEY){const v=r.value;schoolCandidates=Array.isArray(v)?v:Array.isArray(v?.schools)?v.schools:[]}
 }
 let imported=0,skipped=0,errors=[];
 const existingCodes=new Set(schools.map(x=>String(x.code||'').toLowerCase()));
 for(const old of schoolCandidates){
  const name=String(old.name||old.schoolName||'').trim(),county=String(old.county||old.locationCounty||'').trim(),email=String(old.email||old.contactEmail||'').trim().toLowerCase(),code=String(old.code||old.schoolCode||'').trim();
  if(!name||!county||!/^\S+@\S+\.\S+$/.test(email)){skipped++;continue}
  if(code&&existingCodes.has(code.toLowerCase())){skipped++;continue}
  try{
   const d=await schoolApi('/api/schools',{method:'POST',body:JSON.stringify({name,county,email,code:code||undefined,contact:old.contact||old.contactPerson||'',phone:old.phone||old.contactPhone||'',address:old.address||old.physicalAddress||'',registrationNumber:old.registrationNumber||'',subCounty:old.subCounty||'',town:old.town||'',category:old.category||old.type||'',level:old.level||'',ownership:old.ownership||'',curriculum:old.curriculum||'CBC',levels:Array.isArray(old.levels)?old.levels:[],plan:old.plan||'Starter',status:old.status||'Pending',suppressWelcomeEmail:true})});
   imported++;existingCodes.add(String(d.school?.code||code).toLowerCase());
  }catch(error){skipped++;errors.push(name+': '+(error.message||'not imported'))}
 }
 const settingTargets=[
  {source:'navstar_platform_settings_v1',target:PLATFORM_PREFS_KEY},
  {source:'navstar.platform.preferences.v1',target:PLATFORM_PREFS_KEY},
  {source:'navstar_superadmin_workspaces_v1',target:PLATFORM_WORKSPACES_KEY},
  {source:'navstar.platform.workspaces.v1',target:PLATFORM_WORKSPACES_KEY},
  {source:'navstar_tenant_workspaces_v1',target:TENANT_SETTINGS_KEY},
  {source:'navstar.platform.tenant-workspaces.v1',target:TENANT_SETTINGS_KEY}
 ];
 let settingsImported=0;
 for(const map of settingTargets){
  const item=legacyRecoveryRecords.find(x=>x.key===map.source);if(!item)continue;
  const value=typeof item.value==='string'?item.value:JSON.stringify(item.value);
  try{await schoolApi('/api/data/settings',{method:'POST',body:JSON.stringify({setting_key:map.target,setting_value:value})});settingsImported++}catch(error){errors.push(map.source+': '+(error.message||'not imported'))}
 }
 const plansRecord=legacyRecoveryRecords.find(x=>x.key===PLANKEY);
 let plansImported=0;
 if(plansRecord&&Array.isArray(plansRecord.value)){
  for(const p of plansRecord.value){
   if(!p?.name||plans.some(x=>x.name.toLowerCase()===String(p.name).toLowerCase())){skipped++;continue}
   try{await savePlanToDatabase({...p,rate:Number(p.rate??p.price)||0,price:Number(p.price??p.rate)||0,modules:Array.isArray(p.modules)?p.modules.join(', '):String(p.modules||'Core')});plansImported++}
   catch(error){skipped++;errors.push('Plan '+p.name+': '+(error.message||'not imported'))}
  }
 }
 const messagesRecord=legacyRecoveryRecords.find(x=>x.key===MSGKEY);
 let announcementsImported=0;
 if(messagesRecord&&Array.isArray(messagesRecord.value)){
  const markerKey='navstar.recovery.imported-announcement-ids.v1';
  const markerData=await schoolApi('/api/data/settings');
  const markerRow=(markerData.records||[]).find(x=>x.setting_key===markerKey);
  let importedIds=[];try{importedIds=JSON.parse(markerRow?.setting_value||'[]')}catch{}
  for(let i=0;i<messagesRecord.value.length;i++){
   const m=messagesRecord.value[i]||{},legacyId=String(m.id||('legacy-'+i+'-'+String(m.subject||'').slice(0,40)));
   if(importedIds.includes(legacyId)){skipped++;continue}
   if(!String(m.subject||'').trim()||!String(m.body||'').trim()){skipped++;continue}
   const rawStatus=String(m.status||'draft').toLowerCase(),status=['published','scheduled','archived'].includes(rawStatus)?rawStatus:'draft';
   try{
    await schoolApi('/api/data/announcements',{method:'POST',body:JSON.stringify({title:String(m.subject).slice(0,240),body:String(m.body),audience:String(m.audience||'all'),channel:String(m.channel||'in_app'),status})});
    importedIds.push(legacyId);announcementsImported++;
   }catch(error){errors.push('Announcement '+legacyId+': '+(error.message||'not imported'))}
  }
  await schoolApi('/api/data/settings',{method:'POST',body:JSON.stringify({setting_key:markerKey,setting_value:JSON.stringify(importedIds)})});
 }
 await loadSchoolsFromDatabase();await loadPlansFromDatabase();await loadPlatformSettingsFromDatabase();await loadExtraFromDatabase();await loadTenantWorkspaceFromDatabase();
 if(status)status.textContent='Migration finished. Schools imported: '+imported+'. Plans imported: '+plansImported+'. Announcements imported: '+announcementsImported+'. Settings/workspace records copied: '+settingsImported+'. Skipped for review or duplicates: '+skipped+'. '+(errors.length?'Issues: '+errors.slice(0,5).join(' | '):'No API errors reported.');
}
