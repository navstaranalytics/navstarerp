<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:258px minmax(0,1fr)}.sidebar{background:var(--navy);color:#dce6f5;padding:20px 14px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:5px 9px 22px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#4385ff,#20c7b0);display:grid;place-items:center;color:white;font-weight:900;font-size:18px}.brand b{display:block;color:#fff;letter-spacing:1.7px}.brand small{font-size:9px;letter-spacing:1.4px;color:#9fb0ca}.nav-label{padding:15px 10px 6px;color:#8094b4;font-size:9px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase}.nav button{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#c4d1e4;text-align:left;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:12px}.nav button:hover,.nav button.active{background:#263b5c;color:white}.nav .ico{width:19px;text-align:center;color:#9abaff;font-size:15px}.side-bottom{margin-top:auto;padding:15px 9px 3px;border-top:1px solid #2a3d5b;color:#8fa2bf;font-size:10px}.side-bottom b{color:#dbe7f8}.main{min-width:0}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px;position:sticky;top:0;z-index:5}.crumb{font-weight:750}.crumb span{font-weight:400;color:#9aa7b8}.top-actions{display:flex;align-items:center;gap:12px}.global-search{width:min(250px,28vw);border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fafbfd}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;color:#53647c}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e8efff;color:#3264c8;font-weight:800}.content{max-width:1600px;padding:25px 28px 50px;margin:auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:19px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--blue);font-weight:800;text-transform:uppercase}.page-head h1{font-size:25px;letter-spacing:-.7px;margin:4px 0}.muted{color:var(--muted)}.small{font-size:11px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(.96)}.btn.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.red{background:#fff0f0;color:var(--red);border:1px solid #f4d6d8}.btn.green{background:#e8f7ef;color:var(--green);border:1px solid #ccebd9}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.stat-label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.stat-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#edf3ff;color:var(--blue)}.stat strong{display:block;font-size:25px;margin:8px 0 1px}.stat small{font-size:10px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:15px}.panel-pad{padding:17px}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{font-size:14px;margin:0}.panel-head p{font-size:10px;color:var(--muted);margin:2px 0 0}.hero{min-height:180px;border-radius:16px;margin-bottom:17px;padding:26px;position:relative;overflow:hidden;background:#172e50 url('https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1600&q=85') center 44%/cover;color:white;display:flex;align-items:center}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0c1b34ed,#102747a8 55%,#10274715)}.hero-copy{position:relative;max-width:600px}.hero h2{font-size:24px;line-height:1.2;margin:7px 0}.hero p{color:#dbe7f8;margin:0;max-width:520px}.hero .eyebrow{color:#a9c8ff}.chart{height:190px;padding:15px 18px 12px;display:flex;align-items:end;gap:12px;border-bottom:1px solid #edf0f5}.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px}.bar{width:min(35px,75%);border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#55a0ff,#3978f6);min-height:3px}.bar-wrap small{font-size:9px;color:var(--muted)}.legend{display:flex;gap:15px;padding:10px 18px;color:var(--muted);font-size:10px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--blue)}.list{padding:0 17px}.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef1f5}.list-row:last-child{border-bottom:0}.list-row b{font-size:12px}.list-row small{display:block;font-size:10px;color:var(--muted)}.pill{display:inline-block;border-radius:30px;padding:4px 8px;font-size:9px;font-weight:800;background:#edf3ff;color:#3769c8}.pill.active,.pill.healthy{background:#e7f7ef;color:var(--green)}.pill.pending,.pill.warning{background:#fff4df;color:var(--amber)}.pill.suspended,.pill.critical{background:#ffeded;color:var(--red)}.pill.trial{background:#f0ebff;color:var(--purple)}.table-tools{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.field,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink);min-width:0}.field.search{min-width:210px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:780px}th,td{text-align:left;padding:11px 14px;border-top:1px solid #eef1f5;white-space:nowrap}th{font-size:9px;color:#8491a4;letter-spacing:1px;text-transform:uppercase;background:#fbfcfe}td{font-size:11px}.school-name{font-weight:750}.subline{font-size:9px;color:var(--muted)}.row-actions{display:flex;gap:5px}.tiny{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:10px}.tiny:hover{border-color:#9bb8f5}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-field label{display:block;font-size:10px;font-weight:750;margin-bottom:5px}.form-field input,.form-field select,.form-field textarea{width:100%}.form-field.full{grid-column:1/-1}.form-field textarea{min-height:80px;resize:vertical}.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:10px;cursor:pointer}.tab.active{background:#eaf1ff;color:#285fc6;border-color:#bfd1fa}.modal-backdrop{position:fixed;inset:0;background:#0b1930a6;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.open{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:15px;box-shadow:0 25px 90px #06152c55}.modal-head,.modal-foot{padding:15px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head h2{font-size:16px;margin:0}.modal-body{padding:18px 20px}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.toast{position:fixed;right:20px;bottom:20px;background:#142744;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:30;box-shadow:0 8px 28px #10213a33}.toast.show{display:block}.notice{padding:12px 14px;background:#eef5ff;color:#3c5b83;border-radius:9px;font-size:10px;margin-top:12px}.notice.warn{background:#fff5e5;color:#815b20}.metric-line{height:7px;background:#edf1f7;border-radius:20px;overflow:hidden;margin-top:7px}.metric-line span{display:block;height:100%;background:linear-gradient(90deg,#3978f6,#20b8a5);border-radius:20px}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:15px}.quick{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;text-align:left;cursor:pointer}.quick b{display:block;font-size:11px}.quick small{color:var(--muted);font-size:9px}.county-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.county{border:1px solid var(--line);border-radius:8px;padding:9px;font-size:10px}.switch-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef1f5}.switch-row:last-child{border:0}.switch-row b{font-size:11px}.switch-row small{display:block;color:var(--muted);font-size:9px}.switch{accent-color:var(--blue);width:17px;height:17px}
@media(max-width:1050px){.app{grid-template-columns:220px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,1fr)}.content{padding:20px}}
@media(max-width:680px){.app{display:block}.sidebar{height:auto;position:relative;padding:12px}.brand{padding:3px 7px 10px}.nav{display:flex;overflow:auto;gap:5px}.nav-label{display:none}.nav button{white-space:nowrap;width:auto;flex:none;padding:8px}.side-bottom{display:none}.topbar{height:58px;padding:0 13px}.global-search{display:none}.content{padding:15px 12px}.page-head{align-items:flex-start;flex-direction:column}.hero{min-height:205px;padding:20px}.hero h2{font-size:21px}.grid3{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.county-grid{grid-template-columns:repeat(2,1fr)}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}}
</style></head>
<body><div class="app">

<main class="main"><header class="topbar"><div class="crumb">NAVSTAR <span>/</span> <b id="crumb">Overview</b></div><div class="top-actions"><input id="globalSearch" class="global-search" placeholder="Search schools and users"><button class="icon-btn" id="helpBtn">Help</button><div class="avatar">SA</div></div></header><section class="content" id="view"></section></main>
</div>
<div class="modal-backdrop" id="modal"><form class="modal" id="modalForm"><div class="modal-head"><h2 id="modalTitle">Register school</h2><button type="button" class="tiny" id="closeModal">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button type="button" class="btn light" id="cancelModal">Cancel</button><button type="submit" class="btn" id="saveModal">Save record</button></div></form></div>
<div class="toast" id="toast" role="status"></div>
<script>
const KEY='navstar_superadmin_v2',USERKEY='navstar_platform_users_v1',MSGKEY='navstar_messages_v1',SETKEY='navstar_platform_settings_v1',AUDKEY='navstar_audit_v1';
const counties=['Baringo','Bomet','Bungoma','Busia','Elgeyo-Marakwet','Embu','Garissa','Homa Bay','Isiolo','Kajiado','Kakamega','Kericho','Kiambu','Kilifi','Kirinyaga','Kisii','Kisumu','Kitui','Kwale','Laikipia','Lamu','Machakos','Makueni','Mandera','Marsabit','Meru','Migori','Mombasa','Murang’a','Nairobi','Nakuru','Nandi','Narok','Nyamira','Nyandarua','Nyeri','Samburu','Siaya','Taita-Taveta','Tana River','Tharaka-Nithi','Trans Nzoia','Turkana','Uasin Gishu','Vihiga','Wajir','West Pokot'];
const plans=[{name:'Starter',price:2500,learners:300,storage:5,ai:100,modules:'Core school operations'},{name:'Professional',price:6500,learners:1200,storage:25,ai:500,modules:'Core + academics + analytics'},{name:'Enterprise',price:15000,learners:5000,storage:100,ai:2500,modules:'All modules + priority support'},{name:'Trial',price:0,learners:100,storage:2,ai:25,modules:'Evaluation access'}];
const $=id=>document.getElementById(id);let page='overview',schools=load(KEY,[]),users=load(USERKEY,[]),messages=load(MSGKEY,[]),settings=load(SETKEY,{platformName:'NAVSTAR Analytics',supportEmail:'support@navstaranalytics.com',defaultCurrency:'KES',timezone:'Africa/Nairobi',maintenance:false,aiEnabled:true,registrationOpen:true}),audit=load(AUDKEY,[]);
function load(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v));$('saveState').textContent='Saved locally · '+new Date().toLocaleTimeString()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}function log(action,detail){audit.unshift({action,detail,at:new Date().toLocaleString('en-KE')});audit=audit.slice(0,250);save(AUDKEY,audit)}
function money(n){return new Intl.NumberFormat('en-KE',{style:'currency',currency:'KES',maximumFractionDigits:0}).format(Number(n)||0)}function pill(s){let c=['Active','Paid','Healthy','Enabled','Approved'].includes(s)?'active':['Pending','Trial','Review','Scheduled'].includes(s)?'pending':['Suspended','Failed','Critical','Disabled'].includes(s)?'suspended':'trial';return '<span class="pill '+c+'">'+esc(s)+'</span>'}
function head(k,t,d,action=''){return '<div class="page-head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><div class="muted">'+d+'</div></div>'+(action||'')+'</div>'}
function stat(label,value,sub,icon){return '<div class="stat"><div class="stat-label">'+label+'<span class="stat-icon">'+icon+'</span></div><strong>'+value+'</strong><small>'+sub+'</small></div>'}
function panel(title,sub,body,action=''){return '<section class="panel"><div class="panel-head"><div><h2>'+title+'</h2><p>'+sub+'</p></div>'+action+'</div>'+body+'</section>'}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('crumb').textContent=({overview:'Overview',schools:'School directory',regions:'Regional management',subscriptions:'Subscriptions & plans',billing:'Billing & payments',users:'Platform users',academics:'Academic standards',ai:'AI control centre',analytics:'Platform analytics',security:'Security & audit',communications:'Communications',integrations:'Integrations',system:'System health',backup:'Backup & recovery',settings:'Platform settings'})[page];$('view').innerHTML=pages[page]();wirePage()}
function pagesOverview(){let active=schools.filter(s=>s.status==='Active').length,pending=schools.filter(s=>s.status==='Pending').length,rev=schools.filter(s=>s.status==='Active').reduce((a,s)=>a+(Number(s.monthlyFee)||plans.find(p=>p.name===s.plan)?.price||0),0);let bars=[12,18,15,24,28,35,32,42,49,57,61,70];return head('GLOBAL COMMAND CENTRE','Welcome to NAVSTAR.','A central control room for your connected school network.','<button class="btn" data-action="add-school">＋ Register school</button>')+'<section class="hero"><div class="hero-copy"><div class="eyebrow">One platform · Many schools · Connected insight</div><h2>Manage the whole education network from one command centre.</h2><p>Oversee institutions, subscriptions, academic standards, platform users, AI services and system governance.</p></div></section><div class="stats">'+stat('Registered schools',schools.length,'Across all counties','▦')+stat('Active schools',active,'Approved and active','✓')+stat('Awaiting approval',pending,'School onboarding queue','◷')+stat('Indicative monthly plan value',money(rev),'Based on active school plan values','◈')+'</div><div class="grid2">'+panel('School network growth','Illustrative activity trend · replace with live data after backend connection','<div class="chart">'+bars.map((v,i)=>'<div class="bar-wrap"><div class="bar" style="height:'+v*1.45+'px"></div><small>'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i]+'</small></div>').join('')+'</div><div class="legend"><span><i class="dot"></i>Illustrative index, not actual registrations</span></div>')+panel('Onboarding activity','Most recently registered schools','<div class="list">'+(schools.slice(0,5).map(s=>'<div class="list-row"><div><b>'+esc(s.name)+'</b><small>'+esc(s.county)+' · '+esc(s.level)+'</small></div>'+pill(s.status)+'</div>').join('')||'<div class="empty">No school records yet. Register your first institution.</div>')+'</div>','<button class="btn light" data-page-go="schools">View schools</button>')+'</div><div class="grid3">'+panel('Platform governance','Key control areas','<div class="list"><div class="list-row"><b>Academic standards</b>'+pill('Configurable')+'</div><div class="list-row"><b>AI services</b>'+pill(settings.aiEnabled?'Enabled':'Disabled')+'</div><div class="list-row"><b>New registrations</b>'+pill(settings.registrationOpen?'Open':'Closed')+'</div></div>')+panel('Platform activity','Recent administrative actions','<div class="list">'+(audit.slice(0,4).map(a=>'<div class="list-row"><div><b>'+esc(a.action)+'</b><small>'+esc(a.detail)+' · '+esc(a.at)+'</small></div></div>').join('')||'<div class="empty">Administrative activity will appear here.</div>')+'</div>')+panel('Quick actions','Common administrator tasks','<div class="quick-grid"><button class="quick" data-action="add-school"><b>＋ Register school</b><small>Onboard a new institution</small></button><button class="quick" data-page-go="users"><b>♙ Add platform user</b><small>Assign global role</small></button><button class="quick" data-page-go="communications"><b>✉ Send announcement</b><small>Communicate with schools</small></button><button class="quick" data-page-go="academics"><b>▧ Curriculum templates</b><small>Review academic standards</small></button></div>')+'</div><div class="notice warn"><b>Prototype status:</b> This console currently stores demonstration records in this browser only. It is not yet connected to secure central authentication, a shared database, payment gateways or tenant-isolated school data. Do not use real confidential school or learner data until backend security is implemented.</div>'}
function schoolsPage(){let q=($('schoolSearch')?.value||'').toLowerCase(),sf=$('schoolStatus')?.value||'all',cf=$('schoolCounty')?.value||'all';let rows=schools.filter(s=>(!q||[s.name,s.code,s.county,s.email,s.contact].join(' ').toLowerCase().includes(q))&&(sf==='all'||s.status===sf)&&(cf==='all'||s.county===cf));return head('INSTITUTION MANAGEMENT','School directory','Register, review, activate, configure and monitor every school tenant.','<button class="btn" data-action="add-school">＋ Register school</button>')+'<div class="stats">'+stat('Total schools',schools.length,'All institution records','▦')+stat('Active',schools.filter(s=>s.status==='Active').length,'Access enabled','✓')+stat('Pending',schools.filter(s=>s.status==='Pending').length,'Awaiting approval','◷')+stat('Suspended',schools.filter(s=>s.status==='Suspended').length,'Access paused','⊘')+'</div>'+panel('Institution register','School profile, curriculum, subscription and tenant status','<div class="table-tools"><input class="field search" id="schoolSearch" placeholder="Search name, code, contact…" value="'+esc(q)+'"><select id="schoolStatus"><option value="all">All statuses</option>'+['Active','Pending','Suspended'].map(x=>'<option '+(sf===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select id="schoolCounty"><option value="all">All counties</option>'+counties.map(x=>'<option '+(cf===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="btn light" data-action="export-schools">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Institution</th><th>County</th><th>Category / levels</th><th>Curriculum</th><th>Plan</th><th>Status</th><th>Expiry</th><th>Actions</th></tr></thead><tbody>'+(rows.map(s=>'<tr><td><div class="school-name">'+esc(s.name)+'</div><div class="subline">'+esc(s.code||'No code')+' · '+esc(s.email||'No email')+'</div></td><td>'+esc(s.county)+'</td><td>'+esc(s.category||s.level||'—')+'<div class="subline">'+esc((s.levels||[]).join(', '))+'</div></td><td>'+esc(s.curriculum||'CBC')+'</td><td>'+esc(s.plan||'Starter')+'</td><td>'+pill(s.status)+'</td><td>'+esc(s.expiry||'—')+'</td><td><div class="row-actions"><button class="tiny" data-action="school-details" data-id="'+s.id+'">Profile</button><button class="tiny" data-action="school-status" data-id="'+s.id+'">'+(s.status==='Active'?'Suspend':s.status==='Suspended'?'Activate':'Approve')+'</button></div></td></tr>').join('')||'<tr><td colspan="8"><div class="empty">No matching school records. Register a school to get started.</div></td></tr>')+'</tbody></table></div><div class="panel-pad small muted">School profiles include institution identity, ownership, contacts, offered levels, curriculum, users, learner/teacher counts, modules, subscription, usage, branding and activity summaries.</div>','')+'<div class="notice">A school is a separate tenant. In production, each tenant's branding, users, records, settings, documents and permissions must remain isolated from every other school.</div>'}
function regionsPage(){let counts=counties.map(c=>({c,n:schools.filter(s=>s.county===c).length}));return head('GEOGRAPHIC OVERSIGHT','Regional & county management','View school coverage and coordinate onboarding across Kenya.')+'<div class="stats">'+stat('Counties covered',new Set(schools.map(s=>s.county)).size,'Counties with a registered school','⌖')+stat('Counties available',47,'Kenyan county directory','▦')+stat('Schools in Busia',schools.filter(s=>s.county==='Busia').length,'Current directory records','⌖')+stat('Unassigned region',schools.filter(s=>!s.county).length,'Records needing location','!')+'</div>'+panel('County coverage','School count by county','<div class="county-grid">'+counts.map(x=>'<div class="county"><b>'+x.c+'</b><div class="muted">'+x.n+' schools</div></div>').join('')+'</div>')+panel('Regional administrators','Delegate operational oversight by region','<div class="empty">Regional administrator assignment will be enabled when platform user roles and server-side permissions are connected.</div>')}
function subscriptionsPage(){return head('REVENUE & ACCESS','Subscriptions and plans','Configure subscription tiers, trials, renewals, limits and school entitlements.','<button class="btn" data-action="add-plan">＋ Add plan</button>')+'<div class="grid3">'+plans.map(p=>'<div class="panel panel-pad"><div class="eyebrow">'+p.name+' PLAN</div><h2 style="font-size:24px;margin:8px 0">'+money(p.price)+'<span class="muted small"> / month</span></h2><div class="muted small">'+p.modules+'</div><div class="list" style="padding:10px 0"><div class="list-row"><b>Learner limit</b><span>'+p.learners.toLocaleString()+'</span></div><div class="list-row"><b>Storage</b><span>'+p.storage+' GB</span></div><div class="list-row"><b>AI credits</b><span>'+p.ai+'</span></div></div><button class="btn light" data-action="edit-plan" data-plan="'+p.name+'">Edit plan</button></div>').join('')+'</div>'+panel('School subscriptions','Plan assignments and renewals','<div class="table-wrap"><table><thead><tr><th>School</th><th>Plan</th><th>Monthly value</th><th>Renewal / expiry</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(schools.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.plan||'Starter')+'</td><td>'+money(plans.find(p=>p.name===s.plan)?.price||0)+'</td><td>'+esc(s.expiry||'Not set')+'</td><td>'+pill(s.status)+'</td><td><button class="tiny" data-action="school-details" data-id="'+s.id+'">Manage</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">No subscriptions yet.</td></tr>')+'</tbody></table></div>')+'<div class="notice warn">Plan prices and entitlements are editable planning values for this prototype. No actual charges, renewals or payment processing occur here.</div>'}
function billingPage(){let total=schools.reduce((a,s)=>a+(plans.find(p=>p.name===s.plan)?.price||0),0);return head('FINANCIAL OPERATIONS','Billing & payments','Monitor invoices, payment status, M-Pesa and bank reconciliation.')+'<div class="stats">'+stat('Indicative monthly plan value',money(total),'Active and pending records not reconciled','◈')+stat('Invoices issued','0','Backend not connected','▤')+stat('Payments received',money(0),'No live payment feed','✓')+stat('Outstanding balance',money(0),'Awaiting billing engine','◷')+'</div>'+panel('Payment channels','Planned integrations and reconciliation','<div class="list">'+['M-Pesa Daraja API','Bank transfer / statement import','Card and online payment gateway','Manual payment recording and receipt allocation'].map(x=>'<div class="list-row"><b>'+x+'</b>'+pill('Not connected')+'</div>').join('')+'</div>')+panel('Invoice register','Invoices and receipts will appear when billing services are connected','<div class="empty">No live invoices or payment records. Connect the billing backend before using this area for financial operations.</div>')}
function usersPage(){return head('IDENTITY & ACCESS','Platform users','Manage global administrators and delegated regional roles. School users belong to their own tenant.','<button class="btn" data-action="add-user">＋ Add platform user</button>')+panel('Global administrator directory','Only users with approved platform-level roles should appear here','<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Region</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+(users.map(u=>'<tr><td><b>'+esc(u.name)+'</b></td><td>'+esc(u.email)+'</td><td>'+esc(u.role)+'</td><td>'+esc(u.region||'All Kenya')+'</td><td>'+pill(u.status)+'</td><td><button class="tiny" data-action="user-status" data-id="'+u.id+'">'+(u.status==='Active'?'Disable':'Enable')+'</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">No platform users have been added in this prototype.</td></tr>')+'</tbody></table></div>')+'<div class="grid3">'+['Super Admin','Platform Operations','Regional Administrator','Finance Administrator','Academic Standards Administrator','Support Administrator'].map((r,i)=>'<div class="panel panel-pad"><b>'+r+'</b><p class="muted small">'+['Full platform governance; tightly restricted and audited.','School onboarding, modules and operational workflows.','Oversight limited to assigned counties.','Subscription and payment records; no academic data by default.','Curriculum templates, grading and assessment standards.','Support access with scoped, time-limited permissions.'][i]+'</p></div>').join('')+'</div><div class="notice warn">This local directory does not authenticate users or enforce permissions. Production role checks must be enforced on the server for every request.</div>'}
function academicsPage(){let curricula=['Kenyan CBC','Kenyan 8-4-4','International / Cambridge','Custom school curriculum'];let stages=['PP1','PP2','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7','Grade 8','Grade 9','Grade 10','Grade 11','Grade 12','Form 1','Form 2','Form 3','Form 4'];return head('ACADEMIC GOVERNANCE','Academic standards & templates','Maintain curriculum templates, school-level activation, learning areas, pathways and grading frameworks.')+panel('Supported curriculum frameworks','Each school activates only the curriculum and grade levels it offers','<div class="grid3">'+curricula.map((x,i)=>'<div class="panel panel-pad"><b>'+x+'</b><p class="muted small">'+['Pre-primary, primary, junior school and senior school structures.','Form 1–4 and configurable subject / assessment structures.','International framework templates subject to school configuration.','School-specific learning areas, grades and assessment rules.'][i]+'</p>'+pill(i===0?'Primary template':'Configurable')+'</div>').join('')+'</div>')+panel('Grade and level catalogue','Template catalogue · school administrators choose applicable levels','<div class="county-grid">'+stages.map(x=>'<div class="county">'+x+'</div>').join('')+'</div>')+panel('Senior School pathway governance','Grades 10–12 · pathway determines the learner’s available learning areas','<div class="grid3">'+[['STEM','Science, Technology, Engineering and Mathematics'],['Social Sciences','Humanities, languages and related learning areas'],['Arts & Sports Science','Creative arts, performance and sports science']].map(x=>'<div class="panel panel-pad"><b>'+x[0]+'</b><p class="muted small">'+x[1]+'</p></div>').join('')+'</div><div class="notice">Important rule: Senior School learners select a pathway. The system must offer only the learning areas mapped to the learner’s selected pathway, not every learning area across all pathways.</div>')+panel('Assessment and grading templates','Configure grade bands and assessment workflows by curriculum, stage and school','<div class="list">'+['CBC competency / achievement-level descriptors','School-defined score-to-grade mappings','8-4-4 marks, grades and points templates','Assessment types: formative, summative, projects and practicals','Academic years, terms, exam sessions and report-card templates','Moderation, approval and publication workflows'].map(x=>'<div class="list-row"><b>'+x+'</b>'+pill('Template scope')+'</div>').join('')+'</div>')}
function aiPage(){return head('INTELLIGENCE GOVERNANCE','AI control centre','Control AI features, usage limits, safety, document processing and school-level access.')+'<div class="stats">'+stat('AI platform status',settings.aiEnabled?'Enabled':'Disabled','Global feature switch','✧')+stat('Schools with AI','0','Requires live usage telemetry','▦')+stat('Documents processed','0','No processing backend connected','▤')+stat('AI credits used','0','No live usage feed','◷')+'</div>'+panel('Global AI controls','Changes here are planning settings only until server controls are implemented','<div class="panel-pad"><div class="switch-row"><div><b>Enable AI features platform-wide</b><small>Allow eligible school tenants to use approved AI functions.</small></div><input class="switch" type="checkbox" id="aiToggle" '+(settings.aiEnabled?'checked':'')+'></div><div class="switch-row"><div><b>Require school-level AI entitlement</b><small>AI access must respect the school subscription plan.</small></div><input class="switch" type="checkbox" checked disabled></div><div class="switch-row"><div><b>Require document validation before analysis</b><small>Check extracted marks, learner identifiers and source quality.</small></div><input class="switch" type="checkbox" checked disabled></div></div>')+panel('AI capabilities catalogue','Potential platform tools and guardrails','<div class="list">'+['Exam result PDF and spreadsheet extraction','Learner performance and cohort analysis','Published examination results analysis','Question / paper analysis and topic trends','School-level predictive indicators with human review','Usage metering, model logs and prompt safety controls'].map(x=>'<div class="list-row"><b>'+x+'</b>'+pill('Planned')+'</div>').join('')+'</div>')}
function analyticsPage(){return head('PLATFORM INTELLIGENCE','Platform analytics','Track school growth, engagement, subscriptions, storage, AI usage and operational performance.')+'<div class="stats">'+stat('Schools',schools.length,'Current local directory','▦')+stat('Active tenants',schools.filter(s=>s.status==='Active').length,'Local status count','✓')+stat('Platform users',users.length,'Local admin directory','♙')+stat('Announcements',messages.length,'Local message drafts','✉')+'</div><div class="grid2">'+panel('Tenant distribution by county','School counts from local directory','<div class="list">'+counties.map(c=>({c,n:schools.filter(s=>s.county===c).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,10).map(x=>'<div class="list-row"><b>'+x.c+'</b><span>'+x.n+'</span></div>').join('')||'<div class="empty">Register schools to see geographic distribution.</div>')+'</div>')+panel('Plan mix','School subscriptions by selected plan','<div class="list">'+plans.map(p=>'<div class="list-row"><b>'+p.name+'</b><span>'+schools.filter(s=>s.plan===p.name).length+' schools</span></div>').join('')+'</div>')+'</div><div class="notice">This page currently reports only records stored in this browser. Production analytics must use aggregated tenant-safe metrics and must not expose one school’s identifiable learner records to another school.</div>'}
function securityPage(){return head('TRUST & GOVERNANCE','Security & audit','Review administrative activity and configure the controls required for a secure multi-tenant platform.')+panel('Security control checklist','Production controls to implement before onboarding live schools','<div class="list">'+['Secure sign-in, MFA for privileged administrators and account recovery','Role-based access control enforced server-side','Tenant isolation on every database query and file operation','Encryption in transit and at rest; managed secrets','Session expiry, device/session management and rate limiting','Audit trails for approvals, exports, billing and permission changes','Data retention, privacy requests and incident response','Backups, restore tests and security monitoring'].map(x=>'<div class="list-row"><b>'+x+'</b>'+pill('Implementation required')+'</div>').join('')+'</div>')+panel('Administrative audit log','Actions recorded by this browser prototype','<div class="table-wrap"><table><thead><tr><th>Action</th><th>Details</th><th>Date / time</th></tr></thead><tbody>'+(audit.map(a=>'<tr><td>'+esc(a.action)+'</td><td>'+esc(a.detail)+'</td><td>'+esc(a.at)+'</td></tr>').join('')||'<tr><td colspan="3" class="empty">No activity logged yet.</td></tr>')+'</tbody></table></div>')+'<div class="notice warn">Browser-local logs can be edited or deleted by the browser user. They are not tamper-resistant audit records.</div>'}
function communicationsPage(){return head('PLATFORM COMMUNICATIONS','Announcements & notices','Prepare messages for all schools, selected counties or specific institutions.','<button class="btn" data-action="compose">＋ Compose announcement</button>')+panel('Message centre','Draft announcements saved in this browser','<div class="list">'+(messages.map(m=>'<div class="list-row"><div><b>'+esc(m.subject)+'</b><small>'+esc(m.audience)+' · '+esc(m.date)+'</small></div>'+pill(m.status)+'</div>').join('')||'<div class="empty">No announcements created yet.</div>')+'</div>')+'<div class="notice">Sending email, SMS, push or in-app notices requires a connected delivery service and verified recipient permissions. This prototype only saves drafts locally.</div>'}
function integrationsPage(){return head('CONNECTED SERVICES','Integrations','Manage external services used by schools and the NAVSTAR platform.')+panel('Integration catalogue','Connection status and planned service configuration','<div class="list">'+[['Cloudflare Pages','Frontend hosting'],['Cloudflare Workers','Backend API and scheduled jobs'],['Cloudflare D1','Relational tenant-aware database'],['R2 Object Storage','Documents, report PDFs and school files'],['M-Pesa Daraja','Payment collection and confirmation'],['Email / SMS provider','Notices, verification and alerts'],['Google Workspace / Microsoft 365','Optional school productivity integration'],['AI provider','Approved AI document and analytics workflows']].map(x=>'<div class="list-row"><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div>'+pill('Not connected')+'</div>').join('')+'</div>')+'<div class="notice">Never paste API keys or passwords into this page. Production secrets must be stored in protected server-side environment settings.</div>'}
function systemPage(){return head('OPERATIONS MONITORING','System health','Monitor service availability, background jobs, storage, API latency and platform incidents.')+'<div class="stats">'+stat('Frontend','Published','Static site status not verified live','◫')+stat('Backend API','Not connected','No API health endpoint','⌘')+stat('Database','Not connected','No central database yet','▤')+stat('File storage','Not connected','No object storage yet','▣')+'</div>'+panel('Service readiness','Target production service components','<div class="list">'+[['Web application','Cloudflare Pages'],['API and authentication','Cloudflare Workers'],['Tenant database','Cloudflare D1'],['Document storage','Cloudflare R2'],['Email / SMS delivery','Provider integration'],['Monitoring and alerting','Health checks and error reporting']].map(x=>'<div class="list-row"><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div>'+pill('Pending')+'</div>').join('')+'</div>')+panel('Incident register','Operational incidents and maintenance windows','<div class="empty">No live monitoring feed is configured. Incident records will be added after backend monitoring is connected.</div>')}
function backupPage(){return head('BUSINESS CONTINUITY','Backup & recovery','Plan secure backups, retention, restore testing and recovery procedures.')+panel('Backup readiness checklist','Required before production launch','<div class="list">'+['Scheduled encrypted database backups','Object-storage versioning and retention','Off-site / separate-account backup copy','Defined recovery point and recovery time objectives','Documented restore procedure and periodic restore tests','Backup access restricted and fully audited'].map(x=>'<div class="list-row"><b>'+x+'</b>'+pill('Required')+'</div>').join('')+'</div>')+panel('Backup actions','No live backup service is connected','<div class="empty">Backup creation and restoration controls will be enabled only after the secure database and storage services are deployed.</div>')}
function settingsPage(){return head('GLOBAL CONFIGURATION','Platform settings','Set platform identity, defaults, registrations and high-level operating preferences.')+panel('Platform identity & defaults','These settings are stored in this browser prototype','<div class="panel-pad"><form id="settingsForm" class="form-grid"><div class="form-field"><label>Platform name</label><input class="field" name="platformName" value="'+esc(settings.platformName)+'"></div><div class="form-field"><label>Support email</label><input class="field" type="email" name="supportEmail" value="'+esc(settings.supportEmail)+'"></div><div class="form-field"><label>Default currency</label><select name="defaultCurrency"><option '+(settings.defaultCurrency==='KES'?'selected':'')+'>KES</option><option '+(settings.defaultCurrency==='USD'?'selected':'')+'>USD</option></select></div><div class="form-field"><label>Default time zone</label><select name="timezone"><option value="Africa/Nairobi">Africa/Nairobi</option><option value="UTC">UTC</option></select></div><div class="form-field full"><div class="switch-row"><div><b>Allow new school registration</b><small>Enable the onboarding intake workflow.</small></div><input class="switch" type="checkbox" name="registrationOpen" '+(settings.registrationOpen?'checked':'')+'></div><div class="switch-row"><div><b>AI services enabled</b><small>Global availability switch, subject to plan and school permissions.</small></div><input class="switch" type="checkbox" name="aiEnabled" '+(settings.aiEnabled?'checked':'')+'></div><div class="switch-row"><div><b>Maintenance mode</b><small>In production, show a maintenance notice and restrict non-admin access.</small></div><input class="switch" type="checkbox" name="maintenance" '+(settings.maintenance?'checked':'')+'></div></div><div class="form-field full"><button class="btn">Save platform settings</button></div></form></div>')}
const pages={overview:pagesOverview,schools:schoolsPage,regions:regionsPage,subscriptions:subscriptionsPage,billing:billingPage,users:usersPage,academics:academicsPage,ai:aiPage,analytics:analyticsPage,security:securityPage,communications:communicationsPage,integrations:integrationsPage,system:systemPage,backup:backupPage,settings:settingsPage};
function wirePage(){document.querySelectorAll('[data-page-go]').forEach(b=>b.onclick=()=>go(b.dataset.pageGo));$('view').querySelectorAll('[data-page-go]').forEach(b=>b.onclick=()=>go(b.dataset.pageGo));const ss=$('schoolSearch');if(ss){ss.oninput=()=>{let p=page;render();$('schoolSearch').value=ss.value;};$('schoolStatus').onchange=()=>render();$('schoolCounty').onchange=()=>render()}const at=$('aiToggle');if(at)at.onchange=()=>{settings.aiEnabled=at.checked;save(SETKEY,settings);log('AI global switch',at.checked?'Enabled':'Disabled');toast('Local AI setting updated.');};const sf=$('settingsForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let d=new FormData(sf);settings={platformName:d.get('platformName'),supportEmail:d.get('supportEmail'),defaultCurrency:d.get('defaultCurrency'),timezone:d.get('timezone'),registrationOpen:d.has('registrationOpen'),aiEnabled:d.has('aiEnabled'),maintenance:d.has('maintenance')};save(SETKEY,settings);log('Platform settings updated','Global configuration changed');toast('Settings saved in this browser.');render()}}
function go(p){page=p;render();window.scrollTo(0,0)}
function openModal(title,body,submit){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open');$('modalForm').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target));}}
function closeModal(){$('modal').classList.remove('open');$('modalForm').onsubmit=null}
function field(label,name,placeholder='',type='text',value=''){return '<div class="form-field"><label>'+label+'</label><input class="field" name="'+name+'" type="'+type+'" placeholder="'+placeholder+'" value="'+esc(value)+'"></div>'}
function selectField(label,name,options){return '<div class="form-field"><label>'+label+'</label><select name="'+name+'">'+options.map(x=>'<option>'+x+'</option>').join('')+'</select></div>'}
function addSchool(){openModal('Register a school tenant','<div class="form-grid">'+field('Official school name *','name','Full registered name')+field('Institution / EMIS code','code','School code')+field('Registration number','registrationNumber','Ministry / registration reference')+selectField('County *','county',counties)+selectField('Institution category','category',['Public','Private','Community','Faith-based','International','Other'])+selectField('Ownership / sponsor','ownership',['Government','Private individual','Company / organisation','Faith-based sponsor','Community / trust','NGO / charitable organisation','Other'])+selectField('School level','level',['Pre-primary','Primary','Junior School','Senior School','Mixed','Special Needs'])+selectField('Curriculum framework','curriculum',['Kenyan CBC','Kenyan 8-4-4','International / Cambridge','Custom'])+field('Contact person','contact','Headteacher / principal')+field('Official email','email','admin@school.ac.ke','email')+field('Phone number','phone','+254…','tel')+field('Postal / physical address','address','Town, address')+selectField('Subscription plan','plan',plans.map(p=>p.name))+selectField('Initial status','status',['Pending','Active'])+'<div class="form-field full"><label>School levels offered (select after registration in school profile)</label><div class="muted small">Schools can activate only the grades and levels they actually offer.</div></div></div>',d=>{let name=d.get('name')?.trim(),code=d.get('code')?.trim();if(!name||!d.get('county')){toast('School name and county are required.');return}if(code&&schools.some(s=>s.code?.toLowerCase()===code.toLowerCase())){toast('That institution code already exists.');return}let rec={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,code,county:d.get('county'),category:d.get('category'),level:d.get('level'),curriculum:d.get('curriculum'),contact:d.get('contact'),email:d.get('email'),phone:d.get('phone'),address:d.get('address'),registrationNumber pages.security=securityWorkspace;
const oldUsersPage=pages.users;pages.users=()=>oldUsersPage().replace(/<th>Actions<\/th>/,'<th>Actions</th>').replace(/data-action="user-status"/g,'data-action="user-status"');
const oldComms=pages.communications;pages.communications=()=>head('PLATFORM COMMUNICATIONS','Announcements & notices','Draft, organise and review platform-wide messages. Delivery is disabled until a verified messaging provider is connected.','<button class="btn" data-action="compose">＋ Compose announcement</button>')+panel('Message centre','Draft announcements saved in this browser','<div class="table-wrap"><table><thead><tr><th>Subject</th><th>Audience</th><th>Channel</th><th>Created</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+(messages.map((m,i)=>'<tr><td><b>'+esc(m.subject)+'</b></td><td>'+esc(m.audience)+'</td><td>'+esc(m.channel||'In-app notice')+'</td><td>'+esc(m.date)+'</td><td>'+pill(m.status)+'</td><td><button class="tiny" data-action="message-edit" data-id="'+i+'">Edit</button> <button class="tiny" data-action="message-delete" data-id="'+i+'">Delete</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">No announcements created yet.</td></tr>')+'</tbody></table></div>')+'<div class="notice">Messages remain drafts. No email, SMS, push notification or in-app delivery is performed by this static prototype.</div>';
function editPlan(name){const p=plans.find(x=>x.name===name);if(!p)return;openModal('Edit subscription plan · '+p.name,'<div class="form-grid">'+field('Plan name','name','', 'text',p.name)+field('Monthly price (KES)','price','','number',p.price)+field('Maximum learners','learners','','number',p.learners)+field('Storage (GB)','storage','','number',p.storage)+field('Monthly AI credits','ai','','number',p.ai)+'<div class="form-field full"><label>Included modules</label><input class="field" name="modules" value="'+esc(p.modules)+'"></div></div>',d=>{const name2=d.get('name').trim();if(!name2||plans.some(x=>x!==p&&x.name.toLowerCase()===name2.toLowerCase())){toast('Plan name must be unique.');return}const previous=p.name;Object.assign(p,{name:name2,price:Number(d.get('price'))||0,learners:Number(d.get('learners'))||0,storage:Number(d.get('storage'))||0,ai:Number(d.get('ai'))||0,modules:d.get('modules')||'Core'});schools.forEach(s=>{if(s.plan===previous)s.plan=name2});save(PLANKEY,plans);save(KEY,schools);log('Subscription plan updated',previous+' → '+name2);closeModal();render();toast('Plan updated locally.')})}
function editUser(id){const u=users.find(x=>x.id===id);if(!u)return;openModal('Edit platform user','<div class="form-grid">'+field('Full name','name','', 'text',u.name)+field('Email','email','', 'email',u.email)+selectField('Role','role',['Super Admin','Platform Operations','Regional Administrator','Finance Administrator','Academic Standards Administrator','Support Administrator'])+selectField('Region','region',['All Kenya',...counties])+selectField('Status','status',['Active','Pending','Disabled'])+'</div><div class="notice">Changes update the local administrator directory only; they do not alter login permissions.</div>',d=>{Object.assign(u,{name:d.get('name'),email:d.get('email'),role:d.get('role'),region:d.get('region'),status:d.get('status')});save(USERKEY,users);log('Platform user updated',u.email);closeModal();render();toast('Platform user updated locally.')})}
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='edit-plan')editPlan(b.dataset.plan);if(a==='user-edit')editUser(id);if(a==='user-delete'){const u=users.find(x=>x.id===id);if(u&&confirm('Delete this local user record?')){users=users.filter(x=>x.id!==id);save(USERKEY,users);log('Platform user deleted',u.email);render()}}if(a==='message-edit'){const i=Number(id),m=messages[i];if(m){openModal('Edit announcement draft','<div class="form-grid">'+field('Subject','subject','', 'text',m.subject)+selectField('Audience','audience',['All schools','Active schools','Pending schools','Selected county'])+selectField('Channel','channel',['In-app notice','Email','SMS','In-app + Email'])+'<div class="form-field full"><label>Message</label><textarea name="body">'+esc(m.body)+'</textarea></div></div>',d=>{Object.assign(m,{subject:d.get('subject'),audience:d.get('audience'),channel:d.get('channel'),body:d.get('body')});save(MSGKEY,messages);log('Announcement draft edited',m.subject);closeModal();render();toast('Draft updated locally.')})}}if(a==='message-delete'){const i=Number(id);if(messages[i]&&confirm('Delete this draft?')){const m=messages.splice(i,1)[0];save(MSGKEY,messages);log('Announcement draft deleted',m.subject);render()}}});
document.body.addEventListener('change',e=>{const k=e.target.dataset.security;if(k){extra.security[k]=e.target.checked;saveExtra();log('Security preference changed',k+' → '+(e.target.checked?'On':'Off'));toast('Security preference saved locally.')}});
const previousRender2=render;render=function(){previousRender2();if(page==='security'){const search=$('auditSearch'),body=$('auditRows');if(search)search.oninput=()=>{const q=search.value.toLowerCase();body.innerHTML=audit.filter(a=>(a.action+' '+a.detail+' '+a.at).toLowerCase().includes(q)).map(a=>'<tr><td>'+esc(a.action)+'</td><td>'+esc(a.detail)+'</td><td>'+esc(a.at)+'</td></tr>').join('')||'<tr><td colspan="3" class="empty">No matching audit records.</td></tr>'};const ex=$('auditExport');if(ex)ex.onclick=()=>downloadText('navstar-audit-log.csv','action,details,date\\r\\n'+audit.map(a=>[a.action,a.detail,a.at].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\\r\\n'),'text/csv');const cl=$('auditClear');if(cl)cl.onclick=()=>{if(confirm('Clear this browser-local audit log?')){audit=[];save(AUDKEY,audit);render()}}}if(page==='users')document.querySelectorAll('button[data-action="user-status"]').forEach(b=>{const u=users.find(x=>x.id===b.dataset.id);if(u){const edit=document.createElement('button');edit.className='tiny';edit.textContent='Edit';edit.dataset.action='user-edit';edit.dataset.id=u.id;b.parentNode.appendChild(edit);const del=document.createElement('button');del.className='tiny';del.textContent='Delete';del.dataset.action='user-delete';del.dataset.id=u.id;b.parentNode.appendChild(del)}})};

render();
</script></body></html>
