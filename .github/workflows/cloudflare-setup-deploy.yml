name: Navstar Cloudflare Setup and Deploy

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply all pending remote D1 migrations before deployment"
        required: true
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy the Navstar Worker after migrations"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: navstar-cloudflare-production
  cancel-in-progress: false

jobs:
  setup-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Navstar
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub repository Actions secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Check remote D1 migration status
        if: ${{ inputs.apply_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations list navstar-erp-db --remote

      - name: Apply pending remote D1 migrations
        if: ${{ inputs.apply_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply navstar-erp-db --remote

      - name: Deploy Navstar Worker
        if: ${{ inputs.deploy_worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
