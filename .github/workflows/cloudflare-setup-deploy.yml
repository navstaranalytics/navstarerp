name: Navstar Cloudflare Setup and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply all pending remote D1 migrations before deployment"
        required: true
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy the Navstar Worker after migrations"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: navstar-cloudflare-production
  cancel-in-progress: false

jobs:
  setup-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Navstar
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate dashboard JavaScript syntax
        run: node scripts/validate-dashboard-syntax.mjs

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub repository Actions secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Check remote D1 migration status
        if: ${{ github.event_name == 'push' || inputs.apply_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations list navstar-erp-db --remote

      - name: Apply pending remote D1 migrations
        if: ${{ github.event_name == 'push' || inputs.apply_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply navstar-erp-db --remote

      - name: Sync M-Pesa secrets to Cloudflare (when supplied)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_CALLBACK_TOKEN: ${{ secrets.MPESA_CALLBACK_TOKEN }}
          MPESA_ENV: ${{ secrets.MPESA_ENV }}
          MPESA_TRANSACTION_TYPE: ${{ secrets.MPESA_TRANSACTION_TYPE }}
        run: |
          set -eu
          put_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | wrangler secret put "$name"
            fi
          }
          put_secret MPESA_CONSUMER_KEY "$MPESA_CONSUMER_KEY"
          put_secret MPESA_CONSUMER_SECRET "$MPESA_CONSUMER_SECRET"
          put_secret MPESA_SHORTCODE "$MPESA_SHORTCODE"
          put_secret MPESA_PASSKEY "$MPESA_PASSKEY"
          put_secret MPESA_CALLBACK_TOKEN "$MPESA_CALLBACK_TOKEN"
          put_secret MPESA_ENV "$MPESA_ENV"
          put_secret MPESA_TRANSACTION_TYPE "$MPESA_TRANSACTION_TYPE"

      - name: Deploy Navstar Worker
        if: ${{ github.event_name == 'push' || inputs.deploy_worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
