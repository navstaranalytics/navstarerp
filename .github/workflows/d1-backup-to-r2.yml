name: Navstar D1 Backup to R2

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navstar-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Navstar
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is required."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is required."; exit 1; }

      - name: Install Wrangler and verify AWS CLI
        run: |
          set -eu
          npm install --global wrangler@4
          aws --version

      - name: Export remote D1 database
        id: export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BACKUP_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BACKUP_FILE="$RUNNER_TEMP/navstar-erp-db-$BACKUP_ID.sql"
          wrangler d1 export navstar-erp-db --remote --output "$BACKUP_FILE" --skip-confirmation
          test -s "$BACKUP_FILE"
          BYTE_COUNT="$(wc -c < "$BACKUP_FILE" | tr -d ' ')"
          SHA256="$(sha256sum "$BACKUP_FILE" | awk '{print $1}')"
          echo "backup_id=$BACKUP_ID" >> "$GITHUB_OUTPUT"
          echo "backup_file=$BACKUP_FILE" >> "$GITHUB_OUTPUT"
          echo "byte_count=$BYTE_COUNT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload D1 export to private R2 storage (S3-compatible API)
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_ID: ${{ steps.export.outputs.backup_id }}
          BACKUP_FILE: ${{ steps.export.outputs.backup_file }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::CLOUDFLARE_R2_ACCESS_KEY_ID is required."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::CLOUDFLARE_R2_SECRET_ACCESS_KEY is required."; exit 1; }
          OBJECT_KEY="backups/d1/navstar-erp-db-$BACKUP_ID.sql"
          R2_ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp "$BACKUP_FILE" "s3://navstar-erp-storage/$OBJECT_KEY" --endpoint-url "$R2_ENDPOINT" --region auto --content-type "application/sql" --cache-control "private, no-store"
          echo "object_key=$OBJECT_KEY" >> "$GITHUB_OUTPUT"

      - name: Verify R2 backup checksum (S3-compatible API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_FILE: ${{ steps.export.outputs.backup_file }}
          EXPECTED_BYTES: ${{ steps.export.outputs.byte_count }}
          EXPECTED_SHA256: ${{ steps.export.outputs.sha256 }}
          OBJECT_KEY: ${{ steps.upload.outputs.object_key }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::CLOUDFLARE_R2_ACCESS_KEY_ID is required."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::CLOUDFLARE_R2_SECRET_ACCESS_KEY is required."; exit 1; }
          test -n "$OBJECT_KEY" || { echo "::error::The R2 upload did not return an object key."; exit 1; }
          VERIFY_FILE="$RUNNER_TEMP/navstar-backup-verify.sql"
          R2_ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp "s3://navstar-erp-storage/$OBJECT_KEY" "$VERIFY_FILE" --endpoint-url "$R2_ENDPOINT" --region auto
          ACTUAL_BYTES="$(wc -c < "$VERIFY_FILE" | tr -d ' ')"
          ACTUAL_SHA256="$(sha256sum "$VERIFY_FILE" | awk '{print $1}')"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          echo "R2 backup read-back, byte count and SHA-256 verification passed."

      - name: Restore backup into an isolated local D1 database (non-production rehearsal)
        env:
          VERIFY_FILE: ${{ runner.temp }}/navstar-backup-verify.sql
        run: |
          set -euo pipefail
          RESTORE_STATE="$RUNNER_TEMP/navstar-d1-restore-rehearsal"
          mkdir -p "$RESTORE_STATE"
          # This uses Wrangler's local D1 emulator and a fresh temporary state
          # directory. It never writes to the remote production database.
          wrangler d1 execute navstar-erp-db --local --persist-to "$RESTORE_STATE" --file "$VERIFY_FILE"
          INTEGRITY_OUTPUT="$(wrangler d1 execute navstar-erp-db --local --persist-to "$RESTORE_STATE" --command "PRAGMA integrity_check;")"
          printf '%s\\n' "$INTEGRITY_OUTPUT"
          echo "$INTEGRITY_OUTPUT" | grep -Eiq '(^|[[:space:]|])ok([[:space:]|]|$)' || { echo "::error::The restored backup did not pass SQLite integrity_check."; exit 1; }
          echo "Isolated local D1 restore rehearsal and SQLite integrity_check passed."

      - name: Register verified backup in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_ID: ${{ steps.export.outputs.backup_id }}
          EXPECTED_BYTES: ${{ steps.export.outputs.byte_count }}
          EXPECTED_SHA256: ${{ steps.export.outputs.sha256 }}
          OBJECT_KEY: ${{ steps.upload.outputs.object_key }}
        run: |
          set -euo pipefail
          test -n "$OBJECT_KEY" || { echo "::error::The R2 upload did not return an object key."; exit 1; }
          wrangler d1 execute navstar-erp-db --remote --command "INSERT INTO platform_backups(id,backup_type,object_key,byte_count,sha256,status,source) VALUES('$BACKUP_ID','full','$OBJECT_KEY',$EXPECTED_BYTES,'$EXPECTED_SHA256','verified','github-actions')"
          wrangler d1 execute navstar-erp-db --remote --command "SELECT id,status,byte_count,sha256,created_at FROM platform_backups WHERE id='$BACKUP_ID' AND status='verified'"
